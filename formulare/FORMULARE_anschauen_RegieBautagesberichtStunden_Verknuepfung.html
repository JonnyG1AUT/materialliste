  r = computeHoursEntry("K", d(2026,7,9), false, 3);
  add("K Original", r.original, "K");
  add("K Differenz", r.diff, "K");

  r = computeHoursEntry("4A/5", d(2026,7,9), false, 3);
  add("4A/5 Arbeitszeit", buildAutomaticWorktimeFromFront("4A/5", d(2026,7,9), 3, r), "7:00 - 13:00; 1 Stunde Pause");

  r = computeHoursEntry("8", d(2026,7,13), false, 0);
  add("Normaltag Minusstunde", r.diff, "-1");

  r = computeHoursEntry("U", d(2026,7,14), false, 1);
  add("Urlaub keine Minusstunde", r.diff, "U");

  r = computeHoursEntry("6/SW", d(2026,7,15), false, 2);
  add("SW Slash keine Minusstunde", r.diff, "");

  r = computeHoursEntry("3/3/3", d(2026,7,13), false, 0);
  add("Mehrere Baustellen 9 Original", r.original, "9");
  add("Mehrere Baustellen 9 Differenz", r.diff, "");

  r = computeHoursEntry("3 / 4 / 3", d(2026,7,13), false, 0);
  add("Mehrere Baustellen 10 Original", r.original, "9");
  add("Mehrere Baustellen 10 Differenz", r.diff, "1");

  r = computeHoursEntry("2/3/2", d(2026,7,13), false, 0);
  add("Mehrere Baustellen 7 Differenz", r.diff, "-2");

  const failures = tests.filter(t => t.got !== t.expected);
  if (failures.length){
    console.error("Stundenzettel-Logiktest FEHLER", failures);
    return false;
  }
  console.info(`Stundenzettel-Logiktest OK (${tests.length} Prüfungen)`);
  return true;
}

function setAutoValue(pageData, id, value){
  if (!id || originalOverrides.has(id)) return;
  pageData.values[id] = value ?? "";
}

function buildDifferenceRows(frontData, frontMap, person2){
  const month = frontData.values?.[frontMap.monthId] ?? "";
  const year = frontData.values?.[frontMap.yearId] ?? "";
  const rows = [];

  const count = Math.min(frontMap.dateIds.length, frontMap.hourIds.length, 35);
  for (let i=0; i<count; i++){
    const dayText = frontData.values?.[frontMap.dateIds[i]] ?? "";
    const vh = frontData.values?.[frontMap.hourIds[i]] ?? "";
    const d = dateFromRow(dayText, month, year);
    const result = computeHoursEntry(vh, d, person2, i);
    rows.push({
      index:i+1,
      day:String(dayText ?? "").trim(),
      vh:String(vh ?? "").trim(),
      original:result.original,
      diff:result.diff,
      date:d
    });
  }
  return rows;
}

function formatSignedHours(value){
  const n = Number(value);
  if (!Number.isFinite(n) || Math.abs(n) < 1e-9) return "0";
  return `${n > 0 ? "+" : ""}${normalizeNumberString(n)}`;
}

function calculateFrontTotal(frontData, fm){
  return (fm.hourIds || []).reduce((sum,id) => sum + parseWorkedHoursForSum(frontData.values?.[id] ?? ""), 0);
}
function calculateOriginalTotal(originalData, om){
  return (om.hourIds || []).reduce((sum,id) => sum + parseOriginalHoursForSum(originalData.values?.[id] ?? ""), 0);
}
function calculateDiffTotal(rows){
  return (rows || []).reduce((sum,r) => {
    const n = parseLooseNumber(r?.diff);
    return n === null ? sum : sum+n;
  },0);
}
function parseFactorValue(value){
  const n = parseLooseNumber(String(value ?? "").trim());
  return n === null ? 0 : n;
}
function formatCalcNumber(value){
  if (!Number.isFinite(value)) return "0";
  return new Intl.NumberFormat("de-AT", {minimumFractionDigits:0, maximumFractionDigits:2}).format(value);
}
function updateStundenCalcPanel(){
  const panel = document.getElementById("stundenCalcPanel");
  if (!panel) return;
  const on = currentTemplate?.key === "stunden" && !originalOnlyMode;
  panel.classList.toggle("on", on);
  if (!on) return;

  const fm = getFrontMap();
  const frontTotal = calculateFrontTotal(stundenCache.front || emptyPageData(), fm);
  const diffTotal = calculateDiffTotal(differenceRows);
  const baseTotal = frontTotal - diffTotal;

  const fb = parseFactorValue(document.getElementById("factorBase")?.value ?? "1");
  const fd = parseFactorValue(document.getElementById("factorDiff")?.value ?? "1");
  const rb = baseTotal * fb;
  const rd = diffTotal * fd;

  const put=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  put("calcBaseSum", normalizeNumberString(baseTotal));
  put("calcDiffSum", formatSignedHours(diffTotal));
  put("calcBaseResult", formatCalcNumber(rb));
  put("calcDiffResult", formatCalcNumber(rd));
  put("calcGrandTotal", formatCalcNumber(rb+rd));
}

function applyWeeklyAndMonthlyDiffTotals(diffData, frontData, fm, rows){
  const dailyNumeric = rows.map(r => parseLooseNumber(r.diff));
  const monthlyTotal = calculateDiffTotal(rows);
  diffData.values[AUTO_DIFF_SUM_ID] = formatSignedHours(monthlyTotal);

  // Je Kalenderwoche den Netto-Saldo in der Sonntagszeile der Differenzansicht anzeigen.
  // Die Stunden-Spalte bleibt dabei frei für eine eventuelle Sonntagsarbeit; der Hinweis
  // wird deshalb in der Leistungsspalte ergänzt.
  for (let start=0; start<35; start+=7){
    const end = Math.min(start+7, rows.length);
    let weekly = 0;
    let hasInput = false;
    for (let i=start; i<end; i++){
      const rawFront = String(rows[i]?.vh ?? "").trim();
      if (rawFront) hasInput = true;
      const n = dailyNumeric[i];
      if (n !== null) weekly += n;
    }
    const sunday = start + 6;
    const leistungId = fm.leistungIds?.[sunday];
    if (!leistungId || sunday >= rows.length) continue;

    const base = String(frontData.values?.[leistungId] ?? "").trim();
    if (!hasInput){
      diffData.values[leistungId] = base;
      continue;
    }

    const note = `W-Saldo ${formatSignedHours(weekly)}`;
    diffData.values[leistungId] = base ? `${base} | ${note}` : note;
  }
}

function syncFrontToOriginal(skipVisibleFrontCollect = false){
  if (autoSyncBusy) return;
  autoSyncBusy = true;
  try{
    if (!skipVisibleFrontCollect && currentTemplate.key === "stunden" && currentSide === "front"){
      stundenCache.front = collectCurrentPageData();
    }

    const frontData = stundenCache.front || emptyPageData();
    const originalData = stundenCache.finanz || emptyPageData();
    const diffData = JSON.parse(JSON.stringify(frontData || emptyPageData()));
    const fm = getFrontMap();
    const om = getOriginalMap();

    const name = String(frontData.values?.[fm.nameId] ?? "");
    const person2 = name.trim().toLowerCase().includes("hannes");

    // Kopfzeile: Name wird immer 1:1 von VORNE ins ORIGINAL übernommen.
    // Hier bewusst nicht setAutoValue() verwenden, damit ein alter Original-Override
    // den Namen nicht dauerhaft blockieren kann.
    if (om.nameId) originalData.values[om.nameId] = name;
    setAutoValue(originalData, om.monthId, frontData.values?.[fm.monthId] ?? "");
    setAutoValue(originalData, om.yearId, frontData.values?.[fm.yearId] ?? "");

    const month = frontData.values?.[fm.monthId] ?? "";
    const year = frontData.values?.[fm.yearId] ?? "";
    updateWorkCalendarStatus(year);

    const count = Math.min(
      fm.dateIds.length, fm.bauIds.length, fm.hourIds.length,
      om.dateIds.length, om.bauIds.length, om.hourIds.length
    );

    const backData = stundenCache.back || emptyPageData();
    const bm = getBackMap();

    for (let i=0; i<count; i++){
      const dayText = frontData.values?.[fm.dateIds[i]] ?? "";
      const originalBauText = frontData.values?.[fm.bauIds[i]] ?? "";
      let vhText = frontData.values?.[fm.hourIds[i]] ?? "";
      const d = dateFromRow(dayText, month, year);
      const holiday = d ? getHolidayName(d) : "";

      // Feiertage werden auch VORNE automatisch als F eingetragen, solange das Stundenfeld leer ist.
      if (holiday && !String(vhText).trim()){
        vhText = "F";
        frontData.values[fm.hourIds[i]] = "F";
        if (currentTemplate.key === "stunden" && currentSide === "front"){
          setVisibleFieldValue(fm.hourIds[i], "F");
        }
      }

      const result = computeHoursEntry(vhText, d, person2, i);

      // Freitag einer KURZ-Woche: Im Original hat "Kurz" immer Vorrang.
      // Einzige Ausnahme ist F (manuell oder automatisch erkannter Feiertag).
      // Die Differenzberechnung bleibt dabei unverändert.
      const rowTargets = getTargetHoursForRow(d, i);
      const isShortFriday = rowTargets.week === "kurz" && rowTargets.weekday === 5 && rowTargets.p1 === 0;
      if (isShortFriday && String(result.original ?? "").trim().toUpperCase() !== "F") {
        result.original = "Kurz";
      }

      const dashRow = isDashCode(vhText);

      // Bei U/F/K werden die übrigen Textspalten derselben Zeile mit einem mittigen Strich markiert.
      setRowDash(frontData, fm.bauIds, i, dashRow);
      setRowDash(frontData, fm.leistungIds, i, dashRow);
      setRowDash(frontData, fm.kfzIds, i, dashRow);
      if (currentTemplate.key === "stunden" && currentSide === "front"){
        setVisibleFieldValue(fm.bauIds?.[i], frontData.values?.[fm.bauIds?.[i]] ?? "");
        setVisibleFieldValue(fm.leistungIds?.[i], frontData.values?.[fm.leistungIds?.[i]] ?? "");
        setVisibleFieldValue(fm.kfzIds?.[i], frontData.values?.[fm.kfzIds?.[i]] ?? "");
      }

      // Original automatisch befüllen
      // Baustelle nur dann übernehmen, wenn im Original tatsächlich eine offizielle
      // Arbeits-/Abwesenheitszeile vorhanden ist.
      // Besonderheit: Am kurzen Freitag steht im Original zwar "Kurz", aber keine
      // Baustelle, weil dort offiziell nicht gearbeitet wurde.
      const originalWorktime = dashRow ? AUTO_DASH : buildAutomaticWorktimeFromFront(vhText, d, i, result);
      const originalHoursText = String(result.original ?? "").trim();
      const hideOriginalBau =
        (isShortFriday && originalHoursText.toUpperCase() === "KURZ") ||
        (!originalHoursText && !String(originalWorktime ?? "").trim());

      setAutoValue(originalData, om.dateIds[i], dayText);
      setAutoValue(originalData, om.bauIds[i], dashRow ? AUTO_DASH : (hideOriginalBau ? "" : originalBauText));
      setAutoValue(originalData, om.hourIds[i], result.original);
      setAutoValue(originalData, om.worktimeIds[i], originalWorktime);

      // Differenz: gleiche Vorderseite, Stunden werden durch die berechnete Differenz ersetzt.
      const diffHourId = fm.hourIds?.[i];
      if (diffHourId && !diffOverrides.has(diffHourId)){
        diffData.values[diffHourId] = result.diff ?? "";
      }
      setRowDash(diffData, fm.bauIds, i, dashRow);
      setRowDash(diffData, fm.leistungIds, i, dashRow);
      setRowDash(diffData, fm.kfzIds, i, dashRow);

      // HINTEN: Alle Kalendertage des Monats in die erste Spalte übernehmen.
      // Feiertage erhalten zusätzlich ein F in der Spalte Person.
      const backDateId = bm.dateIds?.[i];
      if (backDateId){
        backData.values[backDateId] = d ? String(d.getUTCDate()) : "";
      }

      if (holiday){
        const backPersonId = bm.personIds?.[i];
        if (backPersonId) backData.values[backPersonId] = "F";
      }
    }

    stundenCache.back = backData;

    stundenCache.front = frontData;
    stundenCache.finanz = originalData;
    differenceRows = buildDifferenceRows(frontData, fm, person2);
    frontData.values[AUTO_FRONT_SUM_ID] = normalizeNumberString(calculateFrontTotal(frontData, fm));
    originalData.values[om.sumId] = normalizeNumberString(calculateOriginalTotal(originalData, om));
    if (currentTemplate.key === "stunden" && currentSide === "front"){
      setVisibleFieldValue(AUTO_FRONT_SUM_ID, frontData.values[AUTO_FRONT_SUM_ID]);
    }
    applyWeeklyAndMonthlyDiffTotals(diffData, frontData, fm, differenceRows);
    stundenCache.diff = diffData;
    updateStundenCalcPanel();

    if (currentTemplate.key === "stunden" && currentSide === "finanz"){
      applyDataToCurrentPage(stundenCache.finanz);
    }
    if (currentTemplate.key === "stunden" && currentSide === "diff"){
      applyDataToCurrentPage(stundenCache.diff);
    }
    if (currentTemplate.key === "stunden" && currentSide === "back"){
      applyDataToCurrentPage(stundenCache.back);
    }

    if (document.getElementById("differencePanel")?.classList.contains("on")){
      renderDifferencePanel();
    }
  } finally {
    autoSyncBusy = false;
  }
}

function renderDifferencePanel(){
  const panel = document.getElementById("differencePanel");
  const meta = document.getElementById("differenceMeta");
  const tableHost = document.getElementById("differenceTable");
  if (!panel || !meta || !tableHost) return;

  syncFrontToOriginal();

  const fm = getFrontMap();
  const frontData = stundenCache.front || emptyPageData();
  const name = String(frontData.values?.[fm.nameId] ?? "").trim();
  const person2 = name.toLowerCase().includes("hannes");

  const numericTotal = differenceRows.reduce((sum,r) => {
    const n = parseLooseNumber(r.diff);
    return n === null ? sum : sum + n;
  },0);

  meta.textContent =
    (name ? `Name: ${name} · ` : "") +
    `Regel: ${person2 ? "Person 2 (Hannes)" : "Person 1"} · Differenz gesamt: ${normalizeNumberString(numericTotal)} h`;

  const rows = differenceRows.filter(r => r.day || r.vh || r.original || r.diff);
  if (!rows.length){
    tableHost.innerHTML = "<div>Keine Stunden eingetragen.</div>";
    return;
  }

  const esc = (s) => String(s ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

  tableHost.innerHTML =
    "<table><thead><tr><th>Tag</th><th>V/H</th><th>Original</th><th class=\"num\">Differenz</th></tr></thead><tbody>" +
    rows.map(r => `<tr><td>${esc(r.day)}</td><td>${esc(r.vh)}</td><td>${esc(r.original)}</td><td class="num">${esc(r.diff)}</td></tr>`).join("") +
    "</tbody></table>";
}

// Eingaben auf der aktuell sichtbaren Seite beobachten.
overlay.addEventListener("input", (e) => {
  if (autoSyncBusy || currentTemplate.key !== "stunden") return;

  const field = e.target.closest?.(".field");
  if (!field) return;

  if (currentSide === "front"){
    // Wenn die Quelle geändert wird, darf ein alter manueller Override der
    // abgeleiteten Zielzeile die neue Berechnung nicht blockieren.
    // Manuelle Änderungen bleiben bestehen, solange die zugehörige Quelle
    // unverändert bleibt.
    const fm = getFrontMap();
    const om = getOriginalMap();

    const hourIndex = fm.hourIds.indexOf(field.id);
    const dateIndex = fm.dateIds.indexOf(field.id);
    const bauIndex  = fm.bauIds.indexOf(field.id);

    if (hourIndex >= 0){
      originalOverrides.delete(om.hourIds[hourIndex]);
      originalOverrides.delete(om.worktimeIds[hourIndex]);
      diffOverrides.delete(fm.hourIds[hourIndex]);
    }
    if (dateIndex >= 0){
      originalOverrides.delete(om.dateIds[dateIndex]);
      originalOverrides.delete(om.hourIds[dateIndex]);
      originalOverrides.delete(om.worktimeIds[dateIndex]);
      diffOverrides.delete(fm.hourIds[dateIndex]);
    }
    if (bauIndex >= 0){
      originalOverrides.delete(om.bauIds[bauIndex]);
    }

    // Name/Monat/Jahr beeinflussen Person bzw. Lang/Kurz für alle Zeilen.
    if (field.id === fm.nameId || field.id === fm.monthId || field.id === fm.yearId){
      originalOverrides.delete(om.nameId);
      originalOverrides.delete(om.monthId);
      originalOverrides.delete(om.yearId);
      for (let i=0; i<om.hourIds.length; i++){
        originalOverrides.delete(om.hourIds[i]);
        originalOverrides.delete(om.worktimeIds[i]);
        diffOverrides.delete(fm.hourIds[i]);
      }
    }

    stundenCache.front = collectCurrentPageData();

    // Monat/Jahr oben reichen künftig aus: Datum wird automatisch passend
    // zu den fest gedruckten Wochentagen des Formulars eingetragen.
    if (field.id === fm.monthId || field.id === fm.yearId){
      autoFillFrontDatesFromHeader();
    }

    syncFrontToOriginal();
    return;
  }

  if (currentSide === "diff"){
    const fm = getFrontMap();
    if (fm.hourIds.includes(field.id)){
      diffOverrides.add(field.id);
    }
    stundenCache.diff = collectCurrentPageData();
    return;
  }

  if (currentSide === "finanz"){
    const om = getOriginalMap();
    const managed = new Set([
      om.nameId, om.monthId, om.yearId,
      ...om.dateIds, ...om.bauIds, ...om.hourIds, ...om.worktimeIds
    ]);

    if (managed.has(field.id)){
      originalOverrides.add(field.id);
      stundenCache.finanz = collectCurrentPageData();
      updateStundenCalcPanel();
    }
  }
});

function setTemplateKey(key){
  const t = TEMPLATES[key];
  if (!t) return;

  currentTemplate = t;

  // Button-Highlight
  const bRegie = document.getElementById("tplRegie");
  const bBau = document.getElementById("tplBau");
  const bStd = document.getElementById("tplStunden");
  if (bRegie) bRegie.classList.toggle("primary", key === "regie");
  if (bBau)   bBau.classList.toggle("primary", key === "bau");
  if (bStd)   bStd.classList.toggle("primary", key === "stunden");

  if (key === "stunden"){
    currentSide = "front";
    setActiveStundenButton("stundenFront");
    updateToolbarForTemplate();
    loadStundenLayout("front");
    enableEditorUI(false);
    return;
  }

  updateToolbarForTemplate();

  bgImg.src = t.bg + "?v=" + Date.now();

  // Ein zuvor im Editor gespeichertes Layout hat Vorrang. Gibt es keines
  // (z. B. auf einem neuen Gerät/Browser ohne gespeicherte Daten), wird auf
  // das im Programm eingebettete Standard-Layout zurückgegriffen, statt die
  // Seite komplett ohne Felder anzuzeigen.
  const local = loadLocal(t.storageLayoutKey);
  const eingebettet = EMBEDDED_LAYOUTS[key];
  const layoutZumLaden = (local && Array.isArray(local.fields))
    ? local
    : (eingebettet && Array.isArray(eingebettet.fields) ? eingebettet : null);

  if (layoutZumLaden){
    applyLayout(layoutZumLaden);
    enableEditorUI(false);
    return;
  }

  clearAllFields();
  bgState = { rot: 0, x: 0, y: 0 };
  applyBg();
  enableEditorUI(false);
  setLayoutMode(false);
}

function loadStundenLayout(side, skipPersist = false){
  // aktuelle Seite erst sichern (damit Umschalten nichts löscht)
  // Beim Laden einer Datei darf die alte sichtbare Seite die frisch geladenen Daten nicht überschreiben.
  if (!skipPersist) persistCurrentStundenSide();

  // Bevor Original oder Differenz geöffnet wird, aus der Vorderseite neu berechnen.
  if (side === "finanz" || side === "diff"){
    syncFrontToOriginal();
  }

  clearAllFields();

  const layout = getStundenLayout(side);
  if (layout && Array.isArray(layout.fields)){
    applyLayout(layout);
  } else {
    bgState = { rot: 0, x: 0, y: 0 };
    applyBg();
    setLayoutMode(false);
  }

  bgImg.src =
    (side === "front" || side === "diff")
      ? currentTemplate.bgFront + "?v=" + Date.now()
      : side === "back"
        ? currentTemplate.bgBack + "?v=" + Date.now()
        : currentTemplate.bgFinanz + "?v=" + Date.now();

  currentSide = side;

  // gespeicherte Werte der Zielseite anzeigen
  applyDataToCurrentPage(stundenCache[currentSide] || { values:{}, signatures:{} });
  closeDifferencePanel();
}

function escapeHtml(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function buildPrintPage({ bgSrc, layout, data, skipFieldIds = [] }){
  const pageEl = document.createElement("div");
  pageEl.className = "printPage";

  const bg = document.createElement("img");
  bg.className = "bg";
  bg.src = bgSrc;
  pageEl.appendChild(bg);

  const ov = document.createElement("div");
  ov.className = "overlay";
  pageEl.appendChild(ov);

  const fields = Array.isArray(layout?.fields) ? layout.fields : [];

  const skipSet = new Set(skipFieldIds || []);
  for (const f of fields){
    if (skipSet.has(f.id)) continue;
    const box = document.createElement("div");
    box.className = "field";
    box.style.left = Math.round(f.left || 0) + "px";
    box.style.top = Math.round(f.top || 0) + "px";
    box.style.width = Math.round(f.width || 0) + "px";
    box.style.height = Math.round(f.height || 0) + "px";

    const id = f.id;
    const type = f.type;

    if (type === "sig"){
      const imgUrl = data?.signatures?.[id];
      if (imgUrl){
        const im = document.createElement("img");
        im.src = imgUrl;
        im.style.width = "100%";
        im.style.height = "100%";
        im.style.objectFit = "contain";
        box.appendChild(im);
      }
    } else if (type === "check"){
      const checked = !!data?.values?.[id];
      const mark = document.createElement("div");
      mark.style.width = "100%";
      mark.style.height = "100%";
      mark.style.display = "flex";
      mark.style.alignItems = "center";
      mark.style.justifyContent = "center";
      mark.style.fontSize = "16px";
      mark.style.lineHeight = "1";
      mark.textContent = checked ? "✕" : "";
      box.appendChild(mark);
    } else if (type === "date"){
      const iso = (data?.values?.[id] ?? "");
      const txt = document.createElement("div");
      txt.style.width = "100%";
      txt.style.height = "100%";
      txt.style.whiteSpace = "pre-wrap";
      txt.style.fontFamily = "var(--font-family)";
      txt.style.fontSize = "var(--field-font-size)";
      txt.style.lineHeight = "var(--line-height)";
      txt.style.padding = "2px 3px";
      txt.textContent = formatDateGerman(iso);
      box.appendChild(txt);
    } else {
      const val = (data?.values?.[id] ?? "");
      const txt = document.createElement("div");
      txt.style.width = "100%";
      txt.style.height = "100%";
      txt.style.whiteSpace = "pre-wrap";
      txt.style.fontFamily = "var(--font-family)";
      txt.style.fontSize = "var(--field-font-size)";
      txt.style.lineHeight = "var(--line-height)";
      txt.style.padding = "2px 3px";
      txt.innerHTML = escapeHtml(val);
      box.appendChild(txt);
    }

    ov.appendChild(box);
  }

  return pageEl;
}

function waitForImages(root){
  const imgs = [...root.querySelectorAll("img")];
  const promises = imgs.map(img => new Promise(resolve => {
    if (img.complete && img.naturalWidth > 0) return resolve(true);
    const done = () => resolve(true);
    img.addEventListener("load", done, { once:true });
    img.addEventListener("error", done, { once:true });
  }));
  return Promise.all(promises);
}

  // ===== REGIE/BAU: 1 Seite =====
  if (currentTemplate.key !== "stunden"){
    await waitForImages(page);
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    window.print();
    return;
  }

  persistCurrentStundenSide();
  syncFrontToOriginal();

  const host = ensurePrintHost();
  host.innerHTML = "";
  document.body.classList.add("print-host-on");

  const wrap = document.createElement("div");
  wrap.id = "printWrap";

  // ===== STUNDENZETTEL: immer alle 4 Seiten in einer PDF =====
  // Reihenfolge: Vorne -> Hinten -> Original -> Differenz
  const layoutFront  = getStundenLayout("front")  || { fields: [] };
  const layoutBack   = getStundenLayout("back")   || { fields: [] };
  const layoutFinanz = getStundenLayout("finanz") || { fields: [] };
  const layoutDiff   = getStundenLayout("diff")   || { fields: [] };

  const dataFront  = stundenCache.front  || { values:{}, signatures:{} };
  const dataBack   = stundenCache.back   || { values:{}, signatures:{} };
  const dataFinanz = stundenCache.finanz || { values:{}, signatures:{} };
  const dataDiff   = stundenCache.diff   || { values:{}, signatures:{} };

  const pFront = buildPrintPage({
    bgSrc: currentTemplate.bgFront + "?v=" + Date.now(),
    layout: layoutFront,
    data: dataFront
  });

  const pBack = buildPrintPage({
    bgSrc: currentTemplate.bgBack + "?v=" + Date.now(),
    layout: layoutBack,
    data: dataBack
  });

  const pFinanz = buildPrintPage({
    bgSrc: currentTemplate.bgFinanz + "?v=" + Date.now(),
    layout: layoutFinanz,
    data: dataFinanz,
    // Original-Summe bleibt beim Druck unsichtbar.
    skipFieldIds: ["fin_summe_stunden"]
  });

  const pDiff = buildPrintPage({
    bgSrc: currentTemplate.bgFront + "?v=" + Date.now(),
    layout: layoutDiff,
    data: dataDiff
  });

  wrap.appendChild(pFront);
  wrap.appendChild(pBack);
  wrap.appendChild(pFinanz);
  wrap.appendChild(pDiff);

  host.appendChild(wrap);

  await waitForImages(host);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  window.addEventListener("afterprint", () => {
    clearPrintHost();
  }, { once:true });

  window.print();
}

// Interne Faktoren sind nur am Bildschirm sichtbar.
for (const id of ["factorBase","factorDiff"]){
  document.getElementById(id)?.addEventListener("input", updateStundenCalcPanel);
}

// beide Print-Buttons gehen auf dieselbe Logik
on("printPdf","click", () => { printNow(); });
on("printPdf2","click", () => { printNow(); });

  on("exitEditor","click", () => enableEditorUI(false));

  // Sticky-Markierung: Button optional per Tastenkürzel S im Layout-Modus
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.altKey && (e.key === "l" || e.key === "L")){
      openEditorPrompt();
      e.preventDefault();
      return;
    }

    if (layoutOn && (e.key === "s" || e.key === "S")){
      // nur wenn kein Ctrl/Meta, damit Save nicht gestört wird
      if (!e.ctrlKey && !e.metaKey && !e.altKey){
        toggleStickySelected();
        e.preventDefault();
      }
    }

    if (!layoutOn) return;

    const isCtrl = e.ctrlKey || e.metaKey;
    if (!isCtrl) return;

    if (e.key.toLowerCase() === "c"){
      if (!selectedId) return;
      const el = document.getElementById(selectedId);
      if (!el) return;
      copiedField = snapshotFieldForCopy(el);
      e.preventDefault();
    }
    if (e.key.toLowerCase() === "v"){
      pasteCopiedField();
      e.preventDefault();
    }
  });

  const nudge = 2;
  on("bgLeft","click",  () => { bgState.x -= nudge; applyBg(); });
  on("bgRight","click", () => { bgState.x += nudge; applyBg(); });
  on("bgUp","click",    () => { bgState.y -= nudge; applyBg(); });
  on("bgDown","click",  () => { bgState.y += nudge; applyBg(); });
  on("bgReset","click", () => { bgState = { rot: 0, x: 0, y: 0 }; applyBg(); });

  const bgRot = document.getElementById("bgRot");
  if (bgRot){
    bgRot.addEventListener("input", () => {
      bgState.rot = parseFloat(bgRot.value) || 0;
      applyBg();
    });
  }

  // =====================================================================
  // ====== FIELD FONT SIZE (Editor) =====================================
  // =====================================================================
  const FONT_KEY = "field_font_size_px_v1";
  const FONT_MIN = 8;
  const FONT_MAX = 28;
  const FONT_STEP = 1;

  function getRootStyle(){
    return document.documentElement.style;
  }

  function getFieldFontSizePx(){
    const v = getComputedStyle(document.documentElement).getPropertyValue("--field-font-size").trim();
    const n = parseInt(v.replace("px",""), 10);
    return Number.isFinite(n) ? n : 16;
  }

  function updateFontHint(){
    const h = document.getElementById("fontHint");
    if (!h) return;
    h.textContent = "Feld: " + getFieldFontSizePx() + "px";
  }

  function setFieldFontSizePx(pxVal){
    const v = clamp(parseInt(pxVal, 10) || 16, FONT_MIN, FONT_MAX);
    getRootStyle().setProperty("--field-font-size", v + "px");
    try{ localStorage.setItem(FONT_KEY, String(v)); } catch {}
    updateFontHint();
  }

  function loadFieldFontSize(){
    let v = null;
    try{ v = localStorage.getItem(FONT_KEY); } catch {}
    const n = parseInt(v || "", 10);
    if (Number.isFinite(n)) setFieldFontSizePx(n);
    else setFieldFontSizePx(16);
  }

  function bindFontButtons(){
    const minus = document.getElementById("fontMinus");
    const plus  = document.getElementById("fontPlus");
    const reset = document.getElementById("fontReset");

    if (minus){
      minus.addEventListener("click", () => setFieldFontSizePx(getFieldFontSizePx() - FONT_STEP));
    }
    if (plus){
      plus.addEventListener("click", () => setFieldFontSizePx(getFieldFontSizePx() + FONT_STEP));
    }
    if (reset){
      reset.addEventListener("click", () => setFieldFontSizePx(16));
    }

    updateFontHint();
  }

  // INIT
  enableEditorUI(false);
  setLayoutMode(false);
  fitToViewport();
  applyBg();
  updateToolbarForTemplate();

  loadFieldFontSize();
  bindFontButtons();

  // Beim Drehen des Handys oder Ändern der Fenstergröße neu einpassen.
  // Betrifft nur die Breite (Zoom-Berechnung), daher kein Konflikt mit der
  // Bildschirmtastatur, die nur die Höhe verändert.
  // Bewusst VOR setTemplateKey registriert, damit die Listener auch dann
  // aktiv sind, wenn beim Laden eines Templates unterwegs ein Fehler auftritt.
  window.addEventListener("resize", fitToViewport);
  window.addEventListener("orientationchange", fitToViewport);

  setTemplateKey("regie");

})();



function setActiveStundenButton(activeId) {
  const ids = ["stundenFront", "stundenBack", "stundenFinanz", "stundenDiff"];
  ids.forEach(id => {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.classList.toggle("active-page", id === activeId);
  });
}


(function(){
  const map = {
    stundenFront: "stundenFront",
    stundenBack: "stundenBack",
    stundenFinanz: "stundenFinanz",
    stundenDiff: "stundenDiff"
  };
  Object.entries(map).forEach(([id, activeId]) => {
    const btn = document.getElementById(id);
    if (btn && !btn.dataset.activeWired) {
      btn.addEventListener("click", () => setActiveStundenButton(activeId));
      btn.dataset.activeWired = "1";
    }
  });
})();
