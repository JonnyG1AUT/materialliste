<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formular – PC-Version (Regie/Bau)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
:root{
  --page-w: 794px;   /* A4 @ 96dpi (Screen-Referenz) */
  --page-h: 1123px;

  /* Marke: kräftiges, dunkles Tannengrün (Weiterentwicklung des HS-Bau-Grüns)
     mit warmem Orange als Akzent. Betrifft nur die Bedienoberfläche
     (Leiste/Knöpfe/Panels) - die Formularfelder selbst bleiben unverändert
     Arial/Schwarz-auf-Weiß. */
  --ink:          #16241a;
  --brand:        #1f3d24;
  --brand-dark:   #122117;
  --brand-light:  #dcebd8;
  --paper:        #eef2ea;
  --backdrop:     #b9c9b2;
  --line:         #cdd8c7;
  --muted:        #57624f;
  --accent-warm:      #ff9f1c;
  --accent-warm-dark: #d9820a;
  --ui2: var(--brand);
  --accent: var(--brand);
  --chrome-font: 'Archivo', Arial, sans-serif;

  /* Schrift – GLOBAL (nur Formularfelder, siehe unten) */
  --font-family: Arial, sans-serif;
  --font-size: 16px;
  --line-height: 1.2;

  /* Schrift – FELDER (im Beschreibmodus steuerbar) */
  --field-font-size: 16px;

  /* Scan-Ausrichtung */
  --bg-rot: 0deg;
  --bg-x: 0px;
  --bg-y: 0px;
}


    body{
      margin:0;
      background: var(--backdrop);
      font-family: var(--chrome-font);
      color: var(--ink);
    }

    /* ========= TOOLBARS ========= */
    .bar{
      position: sticky;
      top:0;
      z-index: 9999;
      background: var(--ui2);
      border-bottom:3px solid var(--accent-warm);
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      padding:10px 14px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
    }
    .bar button, .bar label{
      border:1px solid transparent;
      background: rgba(255,255,255,.96);
      color: var(--brand-dark);
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      font-family: var(--chrome-font);
      font-weight:700;
      font-size:13.5px;
      user-select:none;
      transition: background-color .12s ease, border-color .12s ease, transform .05s ease;
    }
    .bar button:hover{
      border-color: var(--accent-warm);
      background: #fff;
    }
    .bar button:active{
      transform: translateY(1px);
    }
    .bar button.primary{
      border-color: var(--accent-warm-dark);
      color: #241200;
      background: var(--accent-warm);
    }
    .bar button.primary:hover{
      background: #ffb347;
    }
    .bar .hint{
      font-size:12.5px;
      color: var(--brand-light);
      padding:0 4px;
      white-space:nowrap;
    }

    /* Am Handy: größere Tippflächen, und der Tastatur-Shortcut-Hinweis
       ist ohne physische Tastatur ohnehin bedeutungslos. */
    @media (max-width: 700px){
      .bar button, .bar label{
        padding:10px 14px;
        min-height:40px;
        font-size:15px;
      }
      .bar .hint[data-desktop-only]{
        display:none;
      }
    }

    /* ========= HANDY: SCHLANKE PERMANENTE LEISTE ========= */
    /* Nur die Formularauswahl (Regiebericht/Bautagesbericht/Stundenzettel)
       und der "Mehr"-Knopf bleiben am Handy immer sichtbar, damit die oben
       klebende Leiste nicht den halben Bildschirm einnimmt. Alles andere
       (Zoom, Schrift, Speichern, Drucken, Editor, ...) klappt erst nach
       Antippen von "⋯ Mehr" auf. Am PC bleibt alles wie gehabt sichtbar. */
    #toolbarMoreToggle{
      display:none;
      background: var(--brand-light) !important;
      border-color: var(--brand) !important;
      color: var(--brand-dark) !important;
    }
    @media (max-width: 700px){
      #toolbarMoreToggle{ display:inline-flex; }
      .extra-btn{ display:none !important; }
      body.toolbar-extra-open .extra-btn{ display:inline-flex !important; }
    }
    /* ========= END HANDY-LEISTE ========= */

    #toolbarEditor{ display:none; }
    body.editor-on #toolbarEditor{ display:flex; }
    body.editor-on #toolbarProd{ display:none; }
    /* ========= DIFFERENZ-ÜBERSICHT ========= */
    #differencePanel{
      display:none;
      width:min(760px, calc(100% - 24px));
      margin:12px auto 0;
      background:#fff;
      border:1px solid var(--line);
      border-radius:10px;
      padding:14px;
      box-sizing:border-box;
      box-shadow:0 4px 14px rgba(51,48,42,.1);
      font-family: Arial, sans-serif;
    }
    #differencePanel.on{ display:block; }
    #differencePanel h3{ margin:0 0 8px; font-size:16px; font-family: var(--chrome-font); color: var(--ink); }
    #differencePanel .diff-meta{ margin:0 0 10px; font-size:13px; color: var(--muted); }
    #differencePanel table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }
    #differencePanel th,#differencePanel td{
      border:1px solid var(--line);
      padding:5px 7px;
      text-align:left;
    }
    #differencePanel th{ background: var(--brand-light); font-family: var(--chrome-font); }
    #differencePanel .num{ text-align:right; font-variant-numeric: tabular-nums; }
    /* ========= END DIFFERENZ-ÜBERSICHT ========= */

    /* ========= END TOOLBARS ========= */

    /* Stage (nur Zentrierung/Padding) */
    .stage{
      padding: 16px 12px 40px;
      display:flex;
      justify-content:center;
      overflow-x:auto; /* Sicherheitsnetz, falls die Seite trotz Einpassung breiter als der Bildschirm ist */
    }

    /* >>> FIX: Wrapper bekommt die “echte” skalierte Fläche im Layout */
    .pageWrap{
      position: relative;
      width: var(--page-w);
      height: var(--page-h);
    }

    .page{
      position: absolute;
      left: 0;
      top: 0;

      width: var(--page-w);
      height: var(--page-h);
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      overflow:hidden;

      transform-origin: top left; /* Zoom */
    }

    .bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;

      object-fit: contain;
      object-position: top left;

      transform-origin: top left;
      transform: translate(var(--bg-x), var(--bg-y)) rotate(var(--bg-rot));

      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    
 /* ========= OVERLAY / FIELDS ========= */
.overlay{
  position:absolute;
  inset:0;
  pointer-events:auto; /* <<< HARD FIX: Overlay bleibt klickbar */
}

.field{
  position:absolute;
  box-sizing:border-box;
  border:none !important;
  outline:none !important;
  background:transparent !important;
  pointer-events:auto; /* <<< HARD FIX: Container bleibt klickbar */
}

body.layout-on .field{
  border:1px dashed rgba(43,124,255,.85) !important;
  background:rgba(43,124,255,.08) !important;
}

.field input,
.field textarea{
  width:100%;
  height:100%;
  border:none !important;
  outline:none !important;
  box-shadow:none !important;
  background:transparent !important;

  font-family:var(--font-family);
  font-size:var(--field-font-size);
  line-height:var(--line-height);

  padding:2px 3px;
  box-sizing:border-box;
}


/* appearance:none NICHT global, sonst killt es Checkbox/UI */
.field input[type="text"],
.field input[type="time"],
.field input[type="date"],
.field textarea{
  -webkit-appearance:none;
  appearance:none;
}

.field textarea{ resize:none; }

body:not(.layout-on) .field *:focus,
body:not(.layout-on) .field *:focus-visible{
  outline:none !important;
  box-shadow:none !important;
  -webkit-box-shadow:none !important;
  -webkit-tap-highlight-color: transparent !important;
}

.field.date-field{
  display:flex;
  align-items:center;
  gap:6px;
  padding:0;
}
.field.date-field .date-display{
  flex:1 1 auto;
  min-width:0;
}
.field.date-field .date-btn{
  flex:0 0 auto;
  width:24px;
  height:22px;
  padding:0;
  border:none !important;
  background:transparent !important;
  cursor:pointer;
  font-size:16px;
  line-height:22px;
  text-align:center;
  user-select:none;
}
.field.date-field .date-native{
  position:absolute;
  width:24px;
  height:22px;
  right:0;
  top:0;
  opacity:0;
  pointer-events:none;
  border:none !important;
  background:transparent !important;
  color:transparent;
  caret-color:transparent;
  -webkit-appearance:none;
  appearance:none;
}
.field.date-field .date-native.active{
  opacity:0.01;
  pointer-events:auto;
  z-index:20;
}

.field.checkbox{
  display:flex;
  align-items:center;
  justify-content:center;
}
.field.checkbox input{
  appearance:none !important;
  -webkit-appearance:none !important;

  width:18px !important;
  height:18px !important;
  padding:0 !important;

  background:#fff !important;                 /* damit man’s sieht */
  border:1px solid rgba(0,0,0,0.6) !important;/* dünner schwarzer Rahmen */
  box-shadow:none !important;                 /* sauber */
  border-radius:2px !important;

  cursor:pointer;
  position:relative;
}

/* X anzeigen wenn aktiv */
.field.checkbox input:checked::after{
  content:"✕";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:15px;
  line-height:1;
  color:#000;
}


.field.signature canvas{
  width:100%;
  height:100%;
  display:block;
  background:transparent !important;
  touch-action:none;
}
body.layout-on .field.signature{
  background:rgba(43,124,255,.06) !important;
}
/* ========= END OVERLAY / FIELDS ========= */

    /* ========= RESIZE HANDLES (4 ECKEN) ========= */
    .handle{
      position:absolute;
      width:10px;
      height:10px;
      border-radius:3px;
      background: var(--accent);
      display:none;
    }
    body.layout-on .handle{ display:block; }

    .handle[data-dir="se"]{ right:-6px; bottom:-6px; cursor:nwse-resize; }
    .handle[data-dir="nw"]{ left:-6px;  top:-6px;    cursor:nwse-resize; }
    .handle[data-dir="ne"]{ right:-6px; top:-6px;    cursor:nesw-resize; }
    .handle[data-dir="sw"]{ left:-6px;  bottom:-6px; cursor:nesw-resize; }

    .tag{ display:none !important; }

    body.layout-on .selected{
      outline:2px solid var(--accent) !important;
      outline-offset:2px !important;
    }

/* ========= NUR-ORIGINAL / VORZEIGEMODUS ========= */
body.original-only #toolbarProd > *{
  display:none !important;
}
body.original-only #toolbarProd #showAll,
body.original-only #toolbarProd #loadDataLabel,
body.original-only #toolbarProd #printPdf{
  display:inline-flex !important;
}
body.original-only #toolbarProd{
  justify-content:flex-end;
}
body.original-only #showAll{
  min-width:44px;
  font-weight:700;
}

/* ========= STUNDEN-SUMMEN / INTERNE FAKTORRECHNUNG ========= */
#stundenCalcPanel{
  display:none;
  max-width:980px;
  margin:8px auto 0;
  padding:10px 14px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  font-family: var(--chrome-font);
  color: var(--ink);
}
#stundenCalcPanel.on{ display:flex; }
#stundenCalcPanel label{ display:flex; align-items:center; gap:6px; }
#stundenCalcPanel input{ width:95px; padding:5px 7px; border:1px solid var(--line); border-radius:6px; font-variant-numeric: tabular-nums; }
#stundenCalcPanel .calc-result{ font-weight:700; min-width:115px; color: var(--brand-dark); font-variant-numeric: tabular-nums; }
body.original-only #stundenCalcPanel{ display:none !important; }
@media print{ #stundenCalcPanel{ display:none !important; } }

/* ========= PRINT ========= */
@page{ size: A4 portrait; margin: 0; }

/* PrintHost ist am Screen immer aus */
#printHost{ display:none; }

@media print{
  html, body{
    width:210mm;
    height:auto;
    margin:0;
    padding:0;
    background:#fff;
  }

  .bar{ display:none !important; }
  #differencePanel{ display:none !important; }

  /* NORMAL (Regie/Bau): Stage/Seite wird gedruckt */
  .stage{ display:flex !important; padding:0 !important; }

  .pageWrap{
    width:210mm !important;
    height:297mm !important;
  }
  .page{
    transform:none !important;
    width:210mm !important;
    height:297mm !important;
    box-shadow:none !important;
    position: relative !important;
  }

  /* STUNDENZETTEL (2 Seiten): Wenn PrintHost aktiv ist, Screen-Stage ausblenden */
  body.print-host-on .stage{ display:none !important; }

  body.print-host-on #printHost{
    display:block !important;
  }

  body.print-host-on #printWrap{
    width:210mm;
    margin:0;
    padding:0;
  }

  body.print-host-on .printPage{
    position: relative;
    width:210mm;
    height:297mm;
    overflow:hidden;
    page-break-after: always;
  }
  body.print-host-on .printPage:last-child{
    page-break-after: auto;
  }

  body.print-host-on .printPage .bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit: contain;
    object-position: top left;
    pointer-events:none;
  }

  body.print-host-on .printPage .overlay{
    position:absolute;
    inset:0;
  }

  body.print-host-on .printPage .field{
    position:absolute;
    background:transparent;
    border:none;
  }
}

  
.active-page {
  background: var(--accent-warm) !important;
  border-color: var(--accent-warm-dark) !important;
  color: #241200 !important;
}

</style>
</head>

<body>

  <!-- ========= TOOLBAR (PRODUKTIV) ========= -->
  <div class="bar" id="toolbarProd">
    <!-- Diese Knöpfe bleiben am Handy immer sichtbar (Formularauswahl). -->
    <button id="tplRegie">Regiebericht</button>
    <button id="tplBau">Bautagesbericht</button>
    <button id="tplStunden">Stundenzettel</button>

    <button id="stundenFront" style="display:none;">Vorne</button>
    <button id="stundenBack"  style="display:none;">Hinten</button>
    <button id="stundenFinanz" style="display:none;">Original</button>
    <button id="stundenDiff" style="display:none;">Differenz</button>

    <button id="toolbarMoreToggle" title="Weitere Funktionen ein-/ausblenden">⋯ Mehr</button>

    <!-- Ab hier: am Handy standardmäßig hinter "⋯ Mehr" versteckt, damit die
         permanent sichtbare Leiste schmal bleibt. Am PC immer sichtbar. -->
    <button id="newReport" class="primary extra-btn">Neuer Bericht</button>
    <button id="newSite" class="extra-btn">Neue Baustelle (alles leer)</button>

    <button id="onlyOriginal" class="extra-btn">Nur Original</button>
    <button id="showAll" style="display:none;" title="Vollansicht">+</button>

    <button id="zoomOut" class="extra-btn">-</button>
    <button id="zoomReset" class="extra-btn">100%</button>
    <button id="zoomIn" class="extra-btn">+</button>
    <span class="hint extra-btn" id="zoomHint">Zoom: 100%</span>

    <!-- ========= SCHRIFTGRÖSSE (PRODUKTIV) ========= -->
    <span class="hint extra-btn">Schrift:</span>
    <button id="fontMinus" class="extra-btn">A-</button>
    <button id="fontPlus" class="extra-btn">A+</button>
    <button id="fontReset" class="extra-btn">Reset</button>
    <span class="hint extra-btn" id="fontHint">Feld: 16px</span>
    <!-- ========= END SCHRIFTGRÖSSE ========= -->

    <button id="saveData" class="extra-btn">Daten speichern</button>
    <label id="loadDataLabel" class="extra-btn">
      Daten laden
      <input id="loadData" type="file" accept="application/json" />
    </label>

    <label id="workCalendarLabel" class="extra-btn" style="display:none;">
      Arbeitskalender laden
      <input id="loadWorkCalendar" type="file" accept="application/json" />
    </label>
    <span class="hint extra-btn" id="workCalendarStatus" style="display:none;"></span>

    <button id="printPdf" class="extra-btn">Als PDF drucken</button>

    <button id="enterEditor" class="extra-btn">Editor/Layout (Passwort)</button>

    <span class="hint extra-btn" data-desktop-only>Shortcut: STRG + ALT + L</span>
  </div>

  <div id="stundenCalcPanel" aria-live="polite">
    <strong>Interne Berechnung:</strong>
    <span>Vorne − Differenz: <b id="calcBaseSum">0</b> h</span>
    <label>× Faktor <input id="factorBase" type="text" inputmode="decimal" value="1"></label>
    <span class="calc-result" id="calcBaseResult">0</span>
    <span>Differenz-Summe: <b id="calcDiffSum">0</b> h</span>
    <label>× Faktor <input id="factorDiff" type="text" inputmode="decimal" value="1"></label>
    <span class="calc-result" id="calcDiffResult">0</span>
    <span>Gesamt: <b id="calcGrandTotal">0</b></span>
  </div>

  <div id="differencePanel" aria-live="polite">
    <h3>Differenz / Überstunden</h3>
    <div class="diff-meta" id="differenceMeta"></div>
    <div id="differenceTable"></div>
  </div>


  <!-- ========= TOOLBAR (EDITOR) ========= -->
  <div class="bar" id="toolbarEditor">
    <button id="toggleLayout" class="primary">Layout-Modus: AUS</button>

    <button id="addText">Textfeld hinzufügen</button>
    <button id="addSmall">Kästchen (kurz) hinzufügen</button>
    <button id="addArea">Textbereich hinzufügen</button>
    <button id="addDate">Datum hinzufügen</button>
    <button id="autoFillDays">Tage 1–31 füllen</button>
    <button id="addTime">Zeit hinzufügen</button>
    <button id="addCheck">Checkbox hinzufügen</button>
    <button id="addSig">Unterschrift hinzufügen</button>

    <button id="deleteSel">Ausgewähltes löschen</button>
    <button id="deleteLast">Letztes Feld löschen</button>

    <button id="copyField">Feld kopieren</button>
    <button id="pasteField">Feld einfügen</button>

    <button id="exportLayout">Layout exportieren</button>
    <label>
      Layout laden
      <input id="importLayout" type="file" accept="application/json" />
    </label>

    <button id="saveData2">Daten speichern</button>
    <label>
      Daten laden
      <input id="loadData2" type="file" accept="application/json" />
    </label>

    <button id="printPdf2">Als PDF drucken</button>

    <span class="hint">Scan:</span>
    <label style="display:flex;align-items:center;gap:6px;">
      Drehung
      <input id="bgRot" type="range" min="-5" max="5" step="0.05" value="0" style="width:160px;">
      <span id="bgRotVal" style="min-width:60px;display:inline-block;">0°</span>
    </label>
    <button id="bgLeft">←</button>
    <button id="bgRight">→</button>
    <button id="bgUp">↑</button>
    <button id="bgDown">↓</button>
    <button id="bgReset">Reset</button>

    <button id="exitEditor">Editor schließen</button>
  </div>


  <!-- ========= STAGE / SEITE ========= -->
  <div class="stage">
    <div id="pageWrap" class="pageWrap">
      <div id="page" class="page">
        <img class="bg" id="bgImg" src="" alt="">
        <div id="overlay" class="overlay"></div>
      </div>
    </div>
  </div>

  function formatDateGerman(iso){
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return "";
    const weekdays = ["So","Mo","Di","Mi","Do","Fr","Sa"];
    const wd = weekdays[d.getDay()];
    const day = d.getDate();
    const month = d.getMonth() + 1;
    const year = d.getFullYear();
    return `${wd} ${day}. ${month}. ${year}`;
  }

  function parseDateToISO(text){
    if (!text) return "";
    const m = text.match(/(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{2,4})/);
    if (!m) return "";
    let dd = parseInt(m[1], 10);
    let mm = parseInt(m[2], 10);
    let yy = parseInt(m[3], 10);
    if (yy < 100) yy = 2000 + yy;
    if (mm < 1 || mm > 12) return "";
    if (dd < 1 || dd > 31) return "";
    const iso = `${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return "";
    if (d.getFullYear() !== yy || (d.getMonth()+1) !== mm || d.getDate() !== dd) return "";
    return iso;
  }

  function getDayFieldsSorted(){

    arr.sort((a,b) => {
      const at = num(a.style.top),  bt = num(b.style.top);
      if (at !== bt) return at - bt;
      const al = num(a.style.left), bl = num(b.style.left);
      return al - bl;
    });
    return arr;
  }

  function autoFillDays(){
    const fields = getDayFieldsSorted();
    if (!fields.length) return;

    // Startfeld = ausgewählt (wenn "small"), sonst erstes
    let startField = null;
    if (selectedId){
      const sel = document.getElementById(selectedId);
      if (sel && sel.dataset.type === "small") startField = sel;
    }
    if (!startField) startField = fields[0];

    let startIndex = fields.indexOf(startField);
    if (startIndex < 0) startIndex = 0;

    // Regel: Startfeld wird IMMER überschrieben (damit es bei 1 beginnt),
    // alle anderen nur, wenn sie leer sind.
    for (let day = 1; day <= 31; day++){
      const idx = (startIndex + (day - 1)) % fields.length;
      const target = fields[idx];

      const existing = getValueFromField(target);
      if (day !== 1 && existing) continue;

      setValueToField(target, day);
    }
  }


  function autoFillDates(){
    // Nur sinnvoll, wenn Datumsfelder existieren
    const fields = getDateFieldsSorted();
    if (!fields.length) return;

    // Startfeld = ausgewählt (wenn Datum), sonst erstes
    let startField = null;
    if (selectedId){
      const sel = document.getElementById(selectedId);
      if (sel && sel.dataset.type === "date") startField = sel;
    }
    if (!startField) startField = fields[0];

    // Start-Index
    let startIndex = fields.indexOf(startField);
    if (startIndex < 0) startIndex = 0;

    // Startdatum
    let startISO = getISOFromDateField(startField);

    // Wenn Startdatum nicht gesetzt: kurz abfragen (sonst geht’s physikalisch nicht)
    if (!startISO){
      const t = (prompt("Startdatum eingeben (TT.MM.JJJJ):", "") || "").trim();
      const iso = parseDateToISO(t);
      if (!iso) return;
      startISO = iso;
      setISOToDateField(startField, startISO);
    }

    const total = daysInMonthFromISO(startISO);

    // Füllen: zyklisch über alle Datumsfelder
    // Sicherheitsregel: NIE bestehende Daten überschreiben (außer Startfeld selbst)
    for (let i = 0; i < total; i++){
      const idx = (startIndex + i) % fields.length;
      const target = fields[idx];

      const existing = getISOFromDateField(target);

      // Startfeld darf gesetzt sein, andere nur wenn leer
      if (i !== 0 && existing) continue;

      const d = new Date(startISO + "T00:00:00");
      d.setDate(d.getDate() + i);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      const iso = `${y}-${m}-${da}`;
      setISOToDateField(target, iso);
    }
  }

  function setScale(s){
    // Untergrenze 0.3 statt 0.5, damit die Seite auch auf schmalen
    // Handy-Bildschirmen (ab ca. 320px Breite) noch vollständig hineinpasst.
    currentScale = clamp(s, 0.3, 2.0);

    // Seite visuell skalieren
    page.style.transform = `scale(${currentScale})`;

    // Wrapper bekommt echte skalierte Größe -> Scroll/Position stimmt
    const baseW = 794;
    const baseH = 1123;
    pageWrap.style.width  = px(baseW * currentScale);
    pageWrap.style.height = px(baseH * currentScale);

    const pct = Math.round(currentScale * 100);
    const zh = document.getElementById("zoomHint");
    if (zh) zh.textContent = "Zoom: " + pct + "%";
  }

  // Berechnet einen Zoom, mit dem die Seite ohne seitliches Scrollen in den
  // sichtbaren Bereich passt (z. B. beim ersten Öffnen am Handy oder nach
  // Drehen des Geräts). Wird nie größer als 100% gewählt.
  function fitToViewport(){
    const baseW = 794;
    const stagePaddingSchaetzung = 24; // grob passend zu .stage padding links/rechts
    const verfuegbareBreite = Math.max(260, window.innerWidth - stagePaddingSchaetzung);
    setScale(Math.min(1, verfuegbareBreite / baseW));
  }

  function fixSignaturePixelRatio(canvas){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    const cssW = Math.max(1, Math.round(rect.width));
    const cssH = Math.max(1, Math.round(rect.height));
    const pxW  = Math.max(1, Math.round(cssW * dpr));
    const pxH  = Math.max(1, Math.round(cssH * dpr));

    if (canvas.width === pxW && canvas.height === pxH) return;

    const old = document.createElement("canvas");
    old.width = canvas.width;
    old.height = canvas.height;
    if (old.width && old.height){
      old.getContext("2d").drawImage(canvas, 0, 0);
    }

    canvas.width = pxW;
    canvas.height = pxH;

    const ctx = canvas.getContext("2d");
    ctx.setTransform(1,0,0,1,0,0);
    if (old.width && old.height){
      ctx.drawImage(old, 0, 0);
    }
  }

  function initSignatureCanvas(canvas){
    let drawing = false;

    function getPos(e){
      const r = canvas.getBoundingClientRect();
      const sx = canvas.width / r.width;
      const sy = canvas.height / r.height;
      return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (layoutOn) return;
      drawing = true;

      fixSignaturePixelRatio(canvas);

      const p = getPos(e);
      const ctx = canvas.getContext("2d");

      ctx.lineWidth = 2 * (window.devicePixelRatio || 1);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);

      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!drawing || layoutOn) return;
      const p = getPos(e);
      const ctx = canvas.getContext("2d");
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      e.preventDefault();
    });

    canvas.addEventListener("pointerup", () => { drawing = false; });
    canvas.addEventListener("pointerleave", () => { drawing = false; });
  }

function createField(type){
  const id = uid();
  const el = document.createElement("div");
  el.className = "field";
  el.id = id;
  el.dataset.type = type;

  // Sticky-Flag: 0/1 (Baustellen-Kopf-Felder)
  el.dataset.sticky = "0";

  el.style.left = "40px";
  el.style.top  = "40px";
  el.style.width = (type === "area") ? "300px" : "160px";
  el.style.height = (type === "area") ? "80px" : "20px";

  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = id;
  el.appendChild(tag);

  // ============================================================
  // ========= SPELLCHECK (OFFLINE / NUR MARKIERUNG) =============
  // Regeln:
  // - Text/Small/Area: spellcheck AN (Browser-Unterstreichung)
  // - Date/Time/Checkbox/Sig: spellcheck AUS (macht keinen Sinn)
  // ============================================================

  if (type === "text" || type === "small"){
    const input = document.createElement("input");
    input.type = "text";
    input.autocomplete = "off";
    input.spellcheck = true;            // <<< FIX
    input.setAttribute("lang","de");    // <<< FIX (Wörterbuch)
    el.appendChild(input);
    if (type === "small") el.style.width = "70px";
  }

  if (type === "date"){
    el.classList.add("date-field");

    const disp = document.createElement("input");
    disp.type = "text";
    disp.className = "date-display";
    disp.placeholder = "Montag 27. 4. 2026";
    disp.spellcheck = false;            // Datumstext nicht korrigieren
    disp.setAttribute("lang","de");
    el.appendChild(disp);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "date-btn";
    btn.textContent = "📅";
    el.appendChild(btn);

    const native = document.createElement("input");
    native.type = "date";
    native.className = "date-native";
    native.spellcheck = false;
    el.appendChild(native);

    function syncFromText(){
      const iso = parseDateToISO(disp.value);
      if (iso) native.value = iso;
    }
    function formatIfValid(){
      const iso = parseDateToISO(disp.value);
      if (iso){
        native.value = iso;
        disp.value = formatDateGerman(iso);
      }
    }
    function closeNative(){ native.classList.remove("active"); }
    function openNativePicker(){
      if (layoutOn) return;
      native.classList.add("active");
      try{
        if (typeof native.showPicker === "function") native.showPicker();
        else { native.focus({preventScroll:true}); native.click(); }
      } catch {
        native.focus({preventScroll:true});
        native.click();
      }
    }

    disp.addEventListener("input", () => { if (!layoutOn) syncFromText(); });
    disp.addEventListener("blur",  () => { if (!layoutOn) formatIfValid(); });

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      openNativePicker();
    });

    native.addEventListener("change", () => {
      disp.value = formatDateGerman(native.value);
      closeNative();
    });
    native.addEventListener("blur", () => closeNative());

    el.style.width = "240px";
    el.style.height = "22px";
  }

  if (type === "time"){
    const input = document.createElement("input");
    input.type = "time";
    input.spellcheck = false;
    el.appendChild(input);
    el.style.width = "80px";
    el.style.height = "22px";
  }

  if (type === "area"){
    const ta = document.createElement("textarea");
    ta.spellcheck = true;               // <<< FIX
    ta.setAttribute("lang","de");       // <<< FIX
    el.appendChild(ta);
  }

  if (type === "check"){
    el.classList.add("checkbox");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.spellcheck = false;
    el.appendChild(input);
    el.style.width = "22px";
    el.style.height = "22px";
  }

  if (type === "sig"){
    el.classList.add("signature");
    const c = document.createElement("canvas");
    el.appendChild(c);
    el.style.width = "300px";
    el.style.height = "80px";
    initSignatureCanvas(c);
    fixSignaturePixelRatio(c);
  }

  const dirs = ["nw","ne","sw","se"];
  for (const d of dirs){
    const h = document.createElement("div");
    h.className = "handle";
    h.dataset.dir = d;
    h.title = "Größe ändern";
    el.appendChild(h);
  }

  overlay.appendChild(el);

  el.addEventListener("pointerdown", (ev) => {
    if (!layoutOn) return;

    const clickedHandle = ev.target.classList.contains("handle");
    const handleDir = clickedHandle ? (ev.target.dataset.dir || "se") : null;

    select(el.id);

    ev.preventDefault();
    ev.stopPropagation();

    const startL = num(el.style.left);
    const startT = num(el.style.top);
    const startW = num(el.style.width, el.offsetWidth);
    const startH = num(el.style.height, el.offsetHeight);

    if (clickedHandle){
      resizeState = {
        id: el.id,
        dir: handleDir,
        startX: ev.clientX,
        startY: ev.clientY,
        startL, startT, startW, startH
      };
    } else {
      dragState = {
        id: el.id,
        startX: ev.clientX,
        startY: ev.clientY,
        startL, startT
      };
    }

    el.setPointerCapture(ev.pointerId);
  });

  setLayoutMode(layoutOn);
  return el.id;
}


  window.addEventListener("pointermove", (ev) => {
    if (!layoutOn) return;

    const s = currentScale || 1;

    if (dragState){
      const el = document.getElementById(dragState.id);
      if (!el) return;

      const dx = (ev.clientX - dragState.startX) / s;
      const dy = (ev.clientY - dragState.startY) / s;

      const w = num(el.style.width, el.offsetWidth);
      const h = num(el.style.height, el.offsetHeight);

      const newL = clamp(dragState.startL + dx, 0, overlay.clientWidth - w);
      const newT = clamp(dragState.startT + dy, 0, overlay.clientHeight - h);

      el.style.left = px(newL);
      el.style.top  = px(newT);
    }

    if (resizeState){
      const el = document.getElementById(resizeState.id);
      if (!el) return;

      const rdx = (ev.clientX - resizeState.startX) / s;
      const rdy = (ev.clientY - resizeState.startY) / s;

      const minW = 18, minH = 18;

      let newL = resizeState.startL;
      let newT = resizeState.startT;
      let newW = resizeState.startW;
      let newH = resizeState.startH;

      switch (resizeState.dir){
        case "se": newW = resizeState.startW + rdx; newH = resizeState.startH + rdy; break;
        case "nw": newL = resizeState.startL + rdx; newT = resizeState.startT + rdy; newW = resizeState.startW - rdx; newH = resizeState.startH - rdy; break;
        case "ne": newT = resizeState.startT + rdy; newW = resizeState.startW + rdx; newH = resizeState.startH - rdy; break;
        case "sw": newL = resizeState.startL + rdx; newW = resizeState.startW - rdx; newH = resizeState.startH + rdy; break;
      }

      if (newW < minW){
        if (resizeState.dir === "nw" || resizeState.dir === "sw") newL -= (minW - newW);
        newW = minW;
      }
      if (newH < minH){
        if (resizeState.dir === "nw" || resizeState.dir === "ne") newT -= (minH - newH);
        newH = minH;
      }

      newL = clamp(newL, 0, overlay.clientWidth  - newW);
      newT = clamp(newT, 0, overlay.clientHeight - newH);

      el.style.left   = px(newL);
      el.style.top    = px(newT);
      el.style.width  = px(newW);
      el.style.height = px(newH);

      const c = el.querySelector("canvas");
      if (c) fixSignaturePixelRatio(c);
    }
  });

  window.addEventListener("pointerup", () => {
    dragState = null;
    resizeState = null;
  });

  page.addEventListener("pointerdown", (e) => {
    if (!layoutOn) return;
    if (e.target === page || e.target.classList.contains("bg") || e.target === overlay) deselect();
  });

  function clearAllFields(){
    overlay.innerHTML = "";
    deselect();
  }

  function applyLayout(layout){
    clearAllFields();

    if (layout && layout.bg){
      bgState.rot = Number(layout.bg.rot) || 0;
      bgState.x = Number(layout.bg.x) || 0;
      bgState.y = Number(layout.bg.y) || 0;
    } else {
      bgState = { rot: 0, x: 0, y: 0 };
    }
    applyBg();

    for (const f of (layout?.fields || [])){
      const tmpId = createField(
        f.type === "sig" ? "sig" :
        f.type === "area" ? "area" :
        f.type === "date" ? "date" :
        f.type === "time" ? "time" :
        f.type === "check" ? "check" :
        f.type === "small" ? "small" : "text"
      );

      const el = document.getElementById(tmpId);
      el.style.left = px(f.left);
      el.style.top = px(f.top);
      el.style.width = px(f.width);
      el.style.height = px(f.height);

      // Sticky aus Layout übernehmen (default 0)
      el.dataset.sticky = (f.sticky ? "1" : "0");

      el.id = f.id;

      const c = el.querySelector("canvas");
      if (c) fixSignaturePixelRatio(c);
    }

    setLayoutMode(false);
  }

  function exportLayout(){
    const fields = [...overlay.querySelectorAll(".field")].map(el => ({
      id: el.id,
      type: el.dataset.type,
      sticky: (el.dataset.sticky === "1"),
      left: Math.round(num(el.style.left)),
      top: Math.round(num(el.style.top)),
      width: Math.round(num(el.style.width, el.offsetWidth)),
      height: Math.round(num(el.style.height, el.offsetHeight))
    }));

    const layout = {
      version: 3,
      template: currentTemplate.key,
      bg: { rot: bgState.rot, x: bgState.x, y: bgState.y },
      fields
    };

    if (currentTemplate.key === "stunden") {
      const key = currentSide === "front"
        ? currentTemplate.storageLayoutKeyFront
        : currentSide === "diff"
          ? currentTemplate.storageLayoutKeyDiff
          : currentSide === "back"
          ? currentTemplate.storageLayoutKeyBack
          : currentTemplate.storageLayoutKeyFinanz;

      const filename = currentSide === "front"
        ? "Stundenzettel vorne leer.json"
        : currentSide === "diff"
          ? "Stundenzettel Differenz leer.json"
          : currentSide === "back"
            ? "Stundenzettel hinten leer.json"
            : "Stundenzettel finanz leer.json";

      storeLocal(key, layout);
      downloadJSON(layout, filename);
      return;
    }

    storeLocal(currentTemplate.storageLayoutKey, layout);
    downloadJSON(layout, currentTemplate.layoutFile);
  }

        img.src = url;

async function loadDataObject(data){
  if (!data || typeof data !== "object") {
    throw new Error("Ungültige Datendatei");
  }

  const normalizePage = (page) => {
    if (!page || typeof page !== "object") return { values:{}, signatures:{} };
    if (page.values && typeof page.values === "object") {
      return {
        values: page.values || {},
        signatures: page.signatures || {}
      };
    }
    // Sehr alte Stundenzettel konnten nur ein flaches Werteobjekt enthalten.
    return { values: page, signatures:{} };
  };

  const isStunden = data.template === "stunden" || data.front || data.back || data.finanz || data.original || data.diff;

  // ===== STUNDENZETTEL: alte und neue Speicherstände kompatibel laden =====
  if (isStunden){
    // Zuerst sicher in den Stundenzettel wechseln. Dadurch stehen die richtigen
    // Layouts und Feldzuordnungen bereit, bevor die Automatik läuft.
    if (currentTemplate.key !== "stunden") setTemplateKey("stunden");

    stundenCache.front  = normalizePage(data.front);
    stundenCache.back   = normalizePage(data.back);
    stundenCache.finanz = normalizePage(data.finanz || data.original);
    stundenCache.diff   = normalizePage(data.diff);

    // Alte Override-Listen nicht übernehmen, wenn sie zu einer anderen Regellogik gehören.
    const sameRules = Number(data.auto?.rulesVersion) === 10;
    originalOverrides = new Set(sameRules && Array.isArray(data.auto?.originalOverrides) ? data.auto.originalOverrides : []);
    diffOverrides = new Set(sameRules && Array.isArray(data.auto?.diffOverrides) ? data.auto.diffOverrides : []);

    // Geladene Daten zuerst aus dem Cache neu berechnen. WICHTIG:
    // Die aktuell sichtbare Vorderseite darf dabei NICHT erneut eingesammelt werden,
    // sonst würden die eben geladenen JSON-Daten sofort wieder mit den alten
    // Bildschirmwerten überschrieben.
    syncFrontToOriginal(true);

    // Im Nur-Original-Modus bleibt nach dem Öffnen einer Datei ausschließlich
    // das Original sichtbar. In der normalen Ansicht wird Vorne geöffnet.
    loadStundenLayout(originalOnlyMode ? "finanz" : "front", true);
    setLayoutMode(false);
    return;
  }

  // ===== NORMAL (regie/bau) =====
  for (const el of overlay.querySelectorAll(".field")){
    const type = el.dataset.type;
    const id = el.id;

    if (type === "sig"){
      const url = data.signatures?.[id];
      const c = el.querySelector("canvas");
      if (c){
        const ctx = c.getContext("2d");
        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,c.width,c.height);
      }
      if (c && url){
        const img = new Image();
        img.onload = () => {
          fixSignaturePixelRatio(c);
          const ctx = c.getContext("2d");
          ctx.clearRect(0,0,c.width,c.height);
          ctx.drawImage(img, 0, 0);
        };
        img.src = url;
      }
    } else if (type === "check"){
      const inp = el.querySelector("input[type=checkbox]");
      if (inp) inp.checked = !!data.values?.[id];
    } else if (type === "date"){
      const iso = (data.values?.[id] ?? "");
      const native = el.querySelector("input[type=date]");
      const disp = el.querySelector(".date-display");
      if (native) native.value = iso;
      if (disp) disp.value = formatDateGerman(iso);
    } else {
      const inp = el.querySelector("input, textarea");
      if (inp) inp.value = (data.values?.[id] ?? "");
    }
  }
  setLayoutMode(false);
}

function workCalendarStorageKey(year){
  return `arbeitskalender_${year}`;
}

function normalizeWorkCalendar(data){
  if (!data || typeof data !== "object") return null;
  const year = Number(data.jahr);
  if (!Number.isInteger(year) || year < 2000 || year > 2100) return null;

  const weeks = data.wochen;
  if (!weeks || typeof weeks !== "object") return null;

  const normalizedWeeks = {};
  for (const [key, value] of Object.entries(weeks)){
    const kw = Number(key);
    const code = String(value ?? "").trim().toUpperCase();
    if (!Number.isInteger(kw) || kw < 1 || kw > 53) continue;
    if (code !== "K" && code !== "L") continue;
    normalizedWeeks[String(kw)] = code;
  }
  if (Object.keys(normalizedWeeks).length < 52) return null;

  const holidays = {};
  if (data.feiertage && typeof data.feiertage === "object"){
    for (const [date, name] of Object.entries(data.feiertage)){
      if (/^\d{4}-\d{2}-\d{2}$/.test(date)){
        holidays[date] = String(name ?? "F").trim() || "F";
      }
    }
  }

  return { jahr:year, wochen:normalizedWeeks, feiertage:holidays };
}

function getWorkCalendar(year){
  // Für fest im Programm hinterlegte Jahre ist der eingebettete Kalender maßgeblich.
  // Dadurch kann eine ältere, versehentlich geladene JSON-Datei 2026 die geprüften
  // WKO-Daten nicht mehr überschreiben. Folgejahre kommen weiterhin aus localStorage.
  const embedded = EMBEDDED_WORK_CALENDARS[String(year)];
  const normalizedEmbedded = normalizeWorkCalendar(embedded);
  if (normalizedEmbedded) return normalizedEmbedded;

  const local = loadLocal(workCalendarStorageKey(year));
  const normalizedLocal = normalizeWorkCalendar(local);
  if (normalizedLocal) return normalizedLocal;

  return null;
}

function isoWeekNumberUTC(d){
  if (!d) return null;
  const tmp = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const dayNum = tmp.getUTCDay() || 7;
  tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
  return Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
}

function getWeekTypeForDate(d){
  if (!d) return null;
  const year = d.getUTCFullYear();
  const kw = isoWeekNumberUTC(d);
  const calendar = getWorkCalendar(year);
  const code = calendar?.wochen?.[String(kw)] ?? null;
  if (code === "L") return "lang";
  if (code === "K") return "kurz";
  return null;
}

function dateKeyUTC(d){
  if (!d) return "";
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
}

function getHolidayName(d){
  if (!d) return "";
  const calendar = getWorkCalendar(d.getUTCFullYear());
  return calendar?.feiertage?.[dateKeyUTC(d)] ?? "";
}

function updateWorkCalendarStatus(yearValue=null){
  const status = document.getElementById("workCalendarStatus");
  if (!status) return;

  let year = Number(yearValue);
  if (!Number.isInteger(year) || year < 2000 || year > 2100){
    const fm = getFrontMap?.();
    const raw = stundenCache?.front?.values?.[fm?.yearId] ?? "";
    const m = String(raw).match(/\d{4}/);
    year = m ? Number(m[0]) : 2026;
  }

  const cal = getWorkCalendar(year);
  status.textContent = cal ? `Kalender ${year}: geladen` : `Kalender ${year}: fehlt`;
}

function ensureBackLayoutComplete(layout){
  // Rückseiten-Layout unverändert verwenden. Keine automatisch erzeugten Felder,
  // weil diese sonst in die falsche Spalte geraten können.
  return layout;
}

const AUTO_DIFF_SUM_ID = "auto_diff_summe";
const AUTO_FRONT_SUM_ID = "auto_front_summe";

function ensureFrontLayoutComplete(layout){
  const copy = JSON.parse(JSON.stringify(layout || {fields:[]}));
  copy.fields = Array.isArray(copy.fields) ? copy.fields : [];
  // Vorne und Differenz besitzen getrennte Summenfelder.
  // Alte gespeicherte Layouts können noch beide IDs enthalten, daher das fremde Feld entfernen.
  copy.fields = copy.fields.filter(f => f.id !== AUTO_DIFF_SUM_ID);
  if (!copy.fields.some(f => f.id === AUTO_FRONT_SUM_ID)){
    copy.fields.push({id:AUTO_FRONT_SUM_ID,type:"text",sticky:false,left:367,top:1002,width:62,height:18});
  }
  return copy;
}

function ensureDiffLayoutComplete(layout){
  const copy = JSON.parse(JSON.stringify(layout || {fields:[]}));
  copy.fields = Array.isArray(copy.fields) ? copy.fields : [];
  // Das Front-Summenfeld darf in der Differenzansicht niemals mitgeladen werden.
  copy.fields = copy.fields.filter(f => f.id !== AUTO_FRONT_SUM_ID);
  if (!copy.fields.some(f => f.id === AUTO_DIFF_SUM_ID)){
    copy.fields.push({
      id: AUTO_DIFF_SUM_ID,
      type: "text",
      sticky: false,
      left: 367,
      top: 1002,
      width: 62,
      height: 18
    });
  }
  return copy;
}

function detectStundenLayoutSideFromFilename(filename){
  const n = String(filename || "").toLowerCase();
  if (n.includes("differenz")) return "diff";
  if (n.includes("finanz") || n.includes("original")) return "finanz";
  if (n.includes("hinten")) return "back";
  if (n.includes("vorne")) return "front";
  return null;
}

function normalizeImportedStundenLayout(side, layout){
  if (!layout || !Array.isArray(layout.fields)) return layout;
  if (side === "front") return ensureFrontLayoutComplete(layout);
  if (side === "diff") return ensureDiffLayoutComplete(layout);
  if (side === "back") return ensureBackLayoutComplete(layout);
  return layout;
}

function getStundenLayout(side){
  const stundenTemplate = TEMPLATES.stunden;
  const localKey = side === "front"
    ? stundenTemplate.storageLayoutKeyFront
    : side === "diff"
      ? stundenTemplate.storageLayoutKeyDiff
      : side === "back"
        ? stundenTemplate.storageLayoutKeyBack
        : stundenTemplate.storageLayoutKeyFinanz;

  let local = loadLocal(localKey);
  // Migration aus älteren Versionen: Differenz hatte früher dasselbe Layout wie Vorne.
  // Falls noch kein eigenes Differenz-Layout existiert, dient das Front-Layout einmalig als Basis.
  if (!local && side === "diff") local = loadLocal(stundenTemplate.storageLayoutKeyFront);

  if (local && Array.isArray(local.fields)){
    if (side === "back") return ensureBackLayoutComplete(local);
    if (side === "diff") return ensureDiffLayoutComplete(local);
    if (side === "front") return ensureFrontLayoutComplete(local);
    return local;
  }

  if (side === "front") return ensureFrontLayoutComplete(EMBEDDED_LAYOUTS.stundenFront);
  if (side === "diff") return ensureDiffLayoutComplete(EMBEDDED_LAYOUTS.stundenFront);
  if (side === "back") return ensureBackLayoutComplete(EMBEDDED_LAYOUTS.stundenBack);
  return EMBEDDED_LAYOUTS.stundenOriginal;
}

function fieldsByGeometry(layout, predicate){
  return (layout?.fields || [])
    .filter(predicate)
    .slice()
    .sort((a,b) => (a.top - b.top) || (a.left - b.left));
}

function getFrontMap(){
  const layout = getStundenLayout("front") || {fields:[]};

  const rowsDate = fieldsByGeometry(layout, f =>
    f.type === "small" && f.left >= 70 && f.left <= 100 && f.top >= 210
  );

  const rowsBau = fieldsByGeometry(layout, f =>
    f.type === "text" && f.left >= 145 && f.left <= 165 && f.top >= 210
  );

  const rowsHours = fieldsByGeometry(layout, f =>
    f.type === "text" &&
    f.left >= 360 && f.left <= 380 &&
    f.top >= 210 &&
    f.id !== AUTO_FRONT_SUM_ID &&
    f.id !== AUTO_DIFF_SUM_ID &&
    f.id !== "fin_summe_stunden"
  ).slice(0, 35);

  const headerText = (layout.fields || []).filter(f => f.type === "text" && f.top < 210);
  const byNear = (left, top) => headerText
    .slice()
    .sort((a,b) => Math.abs(a.left-left)+Math.abs(a.top-top) - (Math.abs(b.left-left)+Math.abs(b.top-top)))[0];

  const rowsLeistung = fieldsByGeometry(layout, f =>
    f.type === "text" && f.left >= 430 && f.left <= 450 && f.top >= 210
  );
  const rowsKfz = fieldsByGeometry(layout, f =>
    f.type === "text" && f.left >= 640 && f.left <= 660 && f.top >= 210
  );

  return {
    nameId:  byNear(119,122)?.id || null,
    monthId: byNear(118,155)?.id || null,
    yearId:  byNear(391,156)?.id || null,
    dateIds: rowsDate.map(f => f.id),
    bauIds: rowsBau.map(f => f.id),
    hourIds: rowsHours.map(f => f.id),
    leistungIds: rowsLeistung.map(f => f.id),
    kfzIds: rowsKfz.map(f => f.id)
  };
}



function parseGermanMonthIndex(value){
  const raw = String(value ?? "").trim().toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue");
  if (!raw) return null;

  if (/^\d{1,2}$/.test(raw)){
    const n = Number(raw);
    return n >= 1 && n <= 12 ? n - 1 : null;
  }

  const aliases = {
    januar:0, jaenner:0, janner:0,
    februar:1,
    maerz:2, marz:2,
    april:3,
    mai:4,
    juni:5,
    juli:6,
    august:7,
    september:8, sept:8,
    oktober:9, okt:9,
    november:10, nov:10,
    dezember:11, dez:11
  };
  return Object.prototype.hasOwnProperty.call(aliases, raw) ? aliases[raw] : null;
}

function autoFillFrontDatesFromHeader(){
  if (currentTemplate.key !== "stunden") return false;

  const fm = getFrontMap();
  const frontData = stundenCache.front || emptyPageData();
  const monthIndex = parseGermanMonthIndex(frontData.values?.[fm.monthId]);
  const year = Number(String(frontData.values?.[fm.yearId] ?? "").trim());

  if (monthIndex === null || !Number.isInteger(year) || year < 1900 || year > 2200){
    return false;
  }

  const totalRows = fm.dateIds.length;
  const firstDay = new Date(Date.UTC(year, monthIndex, 1));
  const mondayOffset = (firstDay.getUTCDay() + 6) % 7; // Mo=0 ... So=6
  const daysInMonth = new Date(Date.UTC(year, monthIndex + 1, 0)).getUTCDate();
  const neededRows = mondayOffset + daysInMonth;

  // Das Formular hat 35 Tageszeilen (= 5 Wochen). Benötigt ein Monat eine
  // sechste Kalenderwoche, werden die letzten Tage auf die zu Monatsbeginn
  // noch freien Wochentagszeilen oben weitergeführt. Beispiel August 2026:
  // Sa 1 ... So 30, danach Mo 31 wieder in der obersten Mo-Zeile.
  // Dadurch bleiben alle Tage des Monats sichtbar, ohne das Layout zu ändern.
  autoFillFrontDatesFromHeader.lastWarning = "";

  for (let i=0; i<totalRows; i++){
    const id = fm.dateIds[i];
    if (id) frontData.values[id] = "";
  }

  for (let day=1; day<=daysInMonth; day++){
    const absoluteRowIndex = mondayOffset + day - 1;
    const rowIndex = absoluteRowIndex % totalRows;
    const id = fm.dateIds[rowIndex];
    if (id) frontData.values[id] = String(day);
  }

  stundenCache.front = frontData;

  if (currentTemplate.key === "stunden" && currentSide === "front"){
    for (const id of fm.dateIds){
      setVisibleFieldValue(id, frontData.values?.[id] ?? "");
    }
  }

  // Die Datumsänderung beeinflusst Feiertage, K/L-Wochen, Original und Differenz.
  const om = getOriginalMap();
  for (let i=0; i<om.dateIds.length; i++){
    originalOverrides.delete(om.dateIds[i]);
    originalOverrides.delete(om.hourIds[i]);
    originalOverrides.delete(om.worktimeIds[i]);
    diffOverrides.delete(fm.hourIds[i]);
  }

  return true;
}
function getOriginalMap(){
  return {
    nameId: "fin_name",
    monthId: "fin_monat",
    yearId: "fin_jahr",
    dateIds: Array.from({length:35},(_,i)=>`fin_datum_${String(i+1).padStart(2,"0")}`),
    bauIds: Array.from({length:35},(_,i)=>`fin_bau_${String(i+1).padStart(2,"0")}`),
    hourIds: Array.from({length:35},(_,i)=>`fin_stunden_${String(i+1).padStart(2,"0")}`),
    worktimeIds: Array.from({length:35},(_,i)=>`fin_arbeitszeit_${String(i+1).padStart(2,"0")}`),
    sumId: "fin_summe_stunden"
  };
}

const AUTO_DASH = "--------------";

function getBackMap(){
  const layout = getStundenLayout("back") || {fields:[]};

  // Erste Spalte = Datum.
  // Nicht auf einen bestimmten Feldtyp verlassen, weil ältere/importierte
  // Rückseiten-Layouts das Datumsfeld teilweise als "text" statt "small" speichern.
  // Entscheidend ist ausschließlich die erste schmale Eingabespalte links.
  const rowsDate = fieldsByGeometry(layout, f =>
    (f.type === "small" || f.type === "text") &&
    f.left >= 65 && f.left <= 115 &&
    f.top >= 210 &&
    f.width <= 45
  );

  // Die Spalte "Person" liegt im vorhandenen Rückseiten-Layout bei ca. x=360.
  // Wichtig: NICHT die Textspalte bei x=145 verwenden, diese gehört zur Fahrtzeit.
  const personCandidates = fieldsByGeometry(layout, f =>
    f.type === "text" && f.left >= 355 && f.left <= 370 && f.top >= 210 && f.width >= 55 && f.width <= 70
  );

  const personIds = rowsDate.map(row => {
    const hit = personCandidates
      .filter(p => Math.abs(p.top - row.top) <= 3)
      .sort((a,b) => Math.abs(a.top-row.top) - Math.abs(b.top-row.top))[0];
    return hit?.id || null;
  });

  return {
    dateIds: rowsDate.map(f => f.id),
    personIds
  };
}

function isDashCode(value){
  const upper = String(value ?? "").trim().toUpperCase();
  return upper === "U" || upper === "SU" || upper === "F" || upper === "K";
}

function setRowDash(pageData, ids, index, on){
  const id = ids?.[index];
  if (!id) return;
  if (on){
    pageData.values[id] = AUTO_DASH;
  } else if (pageData.values[id] === AUTO_DASH){
    pageData.values[id] = "";
  }
}

function setVisibleFieldValue(id, value){
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  const inp = el.querySelector("input, textarea");
  if (inp){
    inp.value = value ?? "";
    inp.style.textAlign = (String(value ?? "") === AUTO_DASH) ? "center" : "";
  }
}

function formatClockFromHours(hours){
  if (!Number.isFinite(hours) || hours < 0) return "";

  // Allgemeine Arbeitszeitberechnung für ganze UND Dezimalstunden:
  // Start 07:00 + tatsächlich angesetzte Arbeitsstunden + 1 Stunde Pause.
  // Beispiele: 7 -> 15:00, 7,5 -> 15:30, 10,5 -> 18:30.
  const totalMinutes = Math.round((7 + hours + 1) * 60);
  const h = Math.floor(totalMinutes / 60) % 24;
  const m = totalMinutes % 60;
  return `7:00 - ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}; 1 Stunde Pause`;
}

function parsePlainMultiHours(rawValue){
  const raw = String(rawValue ?? "").trim();
  if (!raw) return null;
  if (!/^\d+(?:[.,]\d+)?(?:\s*\/\s*\d+(?:[.,]\d+)?)+$/.test(raw)) return null;
  const nums = raw.split("/").map(part => parseLooseNumber(part.trim()));
  if (!nums.length || nums.some(n => n === null || !Number.isFinite(n))) return null;
  return nums.reduce((a,b) => a+b, 0);
}

// Mehrere Baustellenanteile mit optionalem A-Anteil, z.B. 3/1,5/2/2,5A.
// WICHTIG: Erst ab 3 Teilwerten, damit bestehende Arzt-Sonderfälle wie 4A/5
// weiterhin von der eigenen Arzt-Logik behandelt werden.
function parseMultiSiteHours(rawValue){
  const raw = String(rawValue ?? "").trim();
  if (!raw) return null;
  const parts = raw.split("/").map(p => p.trim()).filter(Boolean);
  if (parts.length < 3) return null;

  let total = 0;
  for (const part of parts){
    const m = part.match(/^(\d+(?:[.,]\d+)?)\s*A?$/i);
    if (!m) return null;
    const n = parseLooseNumber(m[1]);
    if (n === null || !Number.isFinite(n)) return null;
    total += n;
  }
  return total;
}


function parseMultiDoctorHours(rawValue){
  const raw = String(rawValue ?? "").trim();
  if (!raw) return null;
  const parts = raw.split("/").map(p => p.trim()).filter(Boolean);
  if (parts.length < 2) return null;

  let doctor = null;
  let doctorIndex = -1;
  let work = 0;
  for (let i=0; i<parts.length; i++){
    const part = parts[i];
    const am = part.match(/^(\d+(?:[.,]\d+)?)\s*A$/i);
    if (am){
      if (doctor !== null) return null; // genau ein A-Anteil erlaubt
      doctor = parseLooseNumber(am[1]);
      doctorIndex = i;
      if (doctor === null) return null;
      continue;
    }
    const nm = part.match(/^(\d+(?:[.,]\d+)?)$/);
    if (!nm) return null;
    const n = parseLooseNumber(nm[1]);
    if (n === null) return null;
    work += n;
  }
  if (doctor === null) return null;
  return { doctor, doctorIndex, work, total: work + doctor, parts };
}
function parseDoctorTotal(rawValue){
  const upper = String(rawValue ?? "").trim().toUpperCase().replace(/\s+/g," ");
  let m = upper.match(/^(\d+(?:[.,]\d+)?)\s*A\s*\/\s*(\d+(?:[.,]\d+)?)$/);
  if (!m) m = upper.match(/^(\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)\s*A$/);
  if (!m) return null;
  const a = parseLooseNumber(m[1]), b = parseLooseNumber(m[2]);
  return a === null || b === null ? null : a+b;
}


function parseGeneralSlashCombination(rawValue){
  const raw = String(rawValue ?? "").trim();
  if (!raw || !raw.includes("/")) return null;

  const parts = raw.split("/").map(p => p.trim()).filter(Boolean);
  if (parts.length < 2) return null;

  let worked = 0;
  let hasPlainNumber = false;
  const codes = [];
  const codedParts = [];

  for (const part of parts){
    let m = part.match(/^(\d+(?:[.,]\d+)?)$/);
    if (m){
      const n = parseLooseNumber(m[1]);
      if (n === null || !Number.isFinite(n)) return null;
      worked += n;
      hasPlainNumber = true;
      continue;
    }

    m = part.match(/^(\d+(?:[.,]\d+)?)\s*(A|U|SU|SW|K|F)$/i);
    if (m){
      const n = parseLooseNumber(m[1]);
      if (n === null || !Number.isFinite(n)) return null;
      const code = m[2].toUpperCase();
      codes.push(code);
      codedParts.push({ code, hours:n });
      continue;
    }

    m = part.match(/^(A|U|SU|SW|K|F)$/i);
    if (m){
      codes.push(m[1].toUpperCase());
      codedParts.push({ code:m[1].toUpperCase(), hours:null });
      continue;
    }

    return null;
  }

  if (!codes.length) return null;
  return { raw, parts, worked, hasPlainNumber, codes, codedParts };
}

function parseWorkedHoursForSum(rawValue){
  const raw = String(rawValue ?? "").trim();
  const upper = raw.toUpperCase().replace(/\s+/g," ");
  if (!upper || ["U","SU","K","F","SW","KURZ","A"].includes(upper)) return 0;

  const generalSlash = parseGeneralSlashCombination(rawValue);
  if (generalSlash) return generalSlash.worked;

  // Für die Summe VORNE zählen nur tatsächlich gearbeitete Stunden.
  // Zeitanteile mit Kürzel (A/U/SU/SW/K/F) werden nicht mitgerechnet:
  // 7/2A -> 7, 7/2U -> 7, 7/2SU -> 7, 7/2SW -> 7, 7 + 2SW -> 7.
  // Reine Baustellenaufteilungen ohne Kürzel werden vollständig addiert: 3/3/3 -> 9.
  const parts = raw.split(/\s*[\/+]+\s*/).map(p => p.trim()).filter(Boolean);
  if (parts.length >= 2){
    let total = 0;
    let recognized = true;
    for (const part of parts){
      const coded = part.match(/^(\d+(?:[.,]\d+)?)\s*(A|U|SU|SW|K|F)$/i);
      if (coded){
        // gekennzeichneter Anteil ist keine tatsächlich gearbeitete Zeit
        continue;
      }
      if (/^(A|U|SU|SW|K|F)$/i.test(part)) continue;
      const numeric = part.match(/^(\d+(?:[.,]\d+)?)$/);
      if (numeric){
        const n = parseLooseNumber(numeric[1]);
        if (n === null || !Number.isFinite(n)){ recognized = false; break; }
        total += n;
        continue;
      }
      recognized = false;
      break;
    }
    if (recognized) return total;
  }

  const n = parseLooseNumber(upper);
  if (n !== null && /^[-+]?\d+(?:[.,]\d+)?$/.test(upper)) return n;

  const worked = getWorkedHoursFromFront(rawValue);
  return worked === null ? 0 : worked;
}
function parseOriginalHoursForSum(rawValue){
  const upper = String(rawValue ?? "").trim().toUpperCase().replace(/\s+/g," ");
  if (!upper || ["U","SU","K","F","SW","KURZ"].includes(upper)) return 0;
  const multiDoctor = parseMultiDoctorHours(rawValue);
  if (multiDoctor) return multiDoctor.total;
  const multiSite = parseMultiSiteHours(rawValue);
  if (multiSite !== null) return multiSite;
  const multi = parsePlainMultiHours(rawValue);
  if (multi !== null) return multi;
  const n = parseLooseNumber(upper);
  if (n !== null && /^[-+]?\d+(?:[.,]\d+)?$/.test(upper)) return n;
  const doctor = parseDoctorTotal(rawValue);
  if (doctor !== null) return doctor;
  let m = upper.match(/^(\d+(?:[.,]\d+)?)\s*\/\s*SW$/);
  if (m) return parseLooseNumber(m[1]) ?? 0;
  m = upper.match(/^SW\s*\/\s*(\d+(?:[.,]\d+)?)$/);
  if (m) return parseLooseNumber(m[1]) ?? 0;
  return 0;
}

function getWorkedHoursFromFront(rawValue){
  const upper = String(rawValue ?? "").trim().toUpperCase().replace(/\s+/g," ");
  if (!upper) return null;

  const multiDoctor = parseMultiDoctorHours(rawValue);
  if (multiDoctor) return multiDoctor.work;

  const generalSlash = parseGeneralSlashCombination(rawValue);
  if (generalSlash) return generalSlash.worked;

  const multiSite = parseMultiSiteHours(rawValue);
  if (multiSite !== null) return multiSite;
  const multi = parsePlainMultiHours(rawValue);
  if (multi !== null) return multi;

  // Reine Stundenangabe: tatsächliche Arbeitsstunden.
  let m = upper.match(/^(\d+(?:[.,]\d+)?)$/);
  if (m) return parseLooseNumber(m[1]);

  // Schlechtwetter mit Slash: 4/SW oder SW/4 = 4 tatsächlich gearbeitete Stunden.
  m = upper.match(/^(\d+(?:[.,]\d+)?)\s*\/\s*SW$/);
  if (m) return parseLooseNumber(m[1]);
  m = upper.match(/^SW\s*\/\s*(\d+(?:[.,]\d+)?)$/);
  if (m) return parseLooseNumber(m[1]);

  // Arzt-Kombinationen: der Teil OHNE A sind die tatsächlich gearbeiteten Stunden.
  // 4A/5 -> 5 gearbeitet; 8/2A -> 8 gearbeitet.
  m = upper.match(/^(\d+(?:[.,]\d+)?)\s*A\s*\/\s*(\d+(?:[.,]\d+)?)$/);
  if (m) return parseLooseNumber(m[2]);
  m = upper.match(/^(\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)\s*A$/);
  if (m) return parseLooseNumber(m[1]);

  return null;
}

function isSlashSchlechtwetter(rawValue){
  const parsed = parseGeneralSlashCombination(rawValue);
  return !!parsed && parsed.codes.includes("SW");
}

function isDoctorCombination(rawValue){
  return parseMultiDoctorHours(rawValue) !== null;
}

function formatClockWorkedSpan(hours){
  if (!Number.isFinite(hours) || hours < 0) return "";
  const totalMinutes = Math.round((7 + hours) * 60);
  const h = Math.floor(totalMinutes / 60) % 24;
  const m = totalMinutes % 60;
  return `7:00 - ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}; 1 Stunde Pause`;
}

function buildAutomaticWorktimeFromFront(rawValue, d, rowIndex, result){
  const targets = Number.isInteger(rowIndex) ? getTargetHoursForRow(d, rowIndex) : getTargetHours(d, false);
  const shortFriday = targets.week === "kurz" && targets.weekday === 5 && targets.p1 === 0;
  if (shortFriday || targets.weekday === 6 || targets.weekday === 7) return "";

  const originalUpper = String(result?.original ?? "").trim().toUpperCase();
  if (!originalUpper || ["F","U","SU","SW","KURZ"].includes(originalUpper)) return "";

  // Slash-Kombinationen mit Kürzeln: alle reinen Zahlenanteile sind tatsächlich gearbeitet.
  // Beispiele: 5/2/SW -> 7 h, SW/5/2 -> 7 h, 5/K -> 5 h, F/5 -> 5 h.
  const generalSlash = parseGeneralSlashCombination(rawValue);
  if (generalSlash && !generalSlash.codes.includes("A") && generalSlash.worked > 0){
    return formatClockFromHours(generalSlash.worked);
  }

  // Arzt-Kombination: Für die Arbeitszeit zählt der Arbeitsanteil im ORIGINAL.
  // Beispiel Hannes: vorne 3/1,5/2/2,5A = 9 Gesamtstunden -> Original 7,5/2,5A.
  // Daher muss die Arbeitszeit mit 7,5 h berechnet werden, nicht mit den 6,5 h aus Vorne.
  if (isDoctorCombination(rawValue)){
    const worked = getWorkedHoursFromFront(result?.original ?? rawValue);
    return worked === null ? "" : formatClockFromHours(worked);
  }

  // Bei normalen Stunden richtet sich die Arbeitszeit nach den Stunden im ORIGINAL.
  // Dadurch gilt z.B. bei Hannes: Original 10 -> 7:00 - 18:00.
  const originalHours = parseLooseNumber(originalUpper);
  if (originalHours !== null && /^[-+]?\d+(?:[.,]\d+)?$/.test(originalUpper)){
    return formatClockFromHours(originalHours);
  }

  return "";
}

function normalizeNumberString(n){
  if (!Number.isFinite(n)) return "";
  const rounded = Math.round(n * 100) / 100;
  return Number.isInteger(rounded)
    ? String(rounded)
    : String(rounded).replace(".", ",");
}

function parseLooseNumber(s){
  const n = parseFloat(String(s ?? "").trim().replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

function parseMonthNumber(s){
  const raw = String(s ?? "").trim().toLowerCase()
    .replaceAll(".", "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");

  const n = parseInt(raw,10);
  if (Number.isFinite(n) && n >= 1 && n <= 12) return n;

  const names = {
    januar:1, jan:1,
    februar:2, feb:2,
    marz:3, mrz:3, mar:3,
    april:4, apr:4,
    mai:5,
    juni:6, jun:6,
    juli:7, jul:7,
    august:8, aug:8,
    september:9, sep:9, sept:9,
    oktober:10, okt:10,
    november:11, nov:11,
    dezember:12, dez:12
  };
  return names[raw] || null;
}

function dateFromRow(dayValue, monthValue, yearValue){
  const dm = String(dayValue ?? "").match(/\d{1,2}/);
  const day = dm ? parseInt(dm[0],10) : NaN;
  const month = parseMonthNumber(monthValue);
  const yearMatch = String(yearValue ?? "").match(/\d{4}/);
  const year = yearMatch ? parseInt(yearMatch[0],10) : NaN;

  if (!Number.isFinite(day) || !month || !Number.isFinite(year)) return null;

  const d = new Date(Date.UTC(year, month-1, day));
  if (d.getUTCFullYear() !== year || d.getUTCMonth() !== month-1 || d.getUTCDate() !== day) return null;
  return d;
}

function mondayUTC(d){
  const day = d.getUTCDay(); // So=0, Mo=1
  const back = (day + 6) % 7;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back);
}

function getTargetHours(d, person2){
  if (!d) return { p1:null, p2:null, week:null, weekday:null };
  const jsDay = d.getUTCDay(); // Mo=1 ... Fr=5
  if (jsDay < 1 || jsDay > 5) return { p1:null, p2:null, week:null, weekday:jsDay };

  const idx = jsDay - 1;
  const week = getWeekTypeForDate(d);
  if (!week) return { p1:null, p2:null, week:null, weekday:jsDay, calendarMissing:true };

  return {
    p1: SOLL_P1[week][idx],
    p2: SOLL_P2[week][idx],
    week,
    weekday: jsDay
  };
}

function getTargetHoursForRow(d, rowIndex){
  if (!d) return { p1:null, p2:null, week:null, weekday:null };

  // Die sichtbare Tages-Spalte des Formulars ist maßgeblich.
  // rowIndex 0=Mo, 1=Di, ... 6=So; danach beginnt die nächste Woche.
  const intendedIdx = ((rowIndex % 7) + 7) % 7; // Mo=0 ... So=6
  if (intendedIdx > 4) return { p1:null, p2:null, week:null, weekday:intendedIdx+1 };

  // Das eingetragene Datum kann in einer Testdatei einmal um einen Tag zur
  // gedruckten Wochentagszeile versetzt sein. Für LANG/KURZ wird es deshalb
  // auf den sichtbaren Wochentag derselben Zeile ausgerichtet.
  const actualIdx = (d.getUTCDay() + 6) % 7; // Mo=0 ... So=6
  let delta = intendedIdx - actualIdx;
  if (delta > 3) delta -= 7;
  if (delta < -3) delta += 7;
  const aligned = new Date(d.getTime() + delta * 24*60*60*1000);

  const week = getWeekTypeForDate(aligned);
  if (!week){
    return { p1:null, p2:null, week:null, weekday:intendedIdx + 1, calendarMissing:true };
  }
  return {
    p1: SOLL_P1[week][intendedIdx],
    p2: SOLL_P2[week][intendedIdx],
    week,
    weekday: intendedIdx + 1
  };
}

function computeHoursEntry(rawValue, d, person2, rowIndex=null){
  const raw = String(rawValue ?? "").trim();
  const upper = raw.toUpperCase().replace(/\s+/g," ").trim();
  const targets = Number.isInteger(rowIndex) ? getTargetHoursForRow(d, rowIndex) : getTargetHours(d, person2);

  // Ohne hinterlegten Jahreskalender werden keine Sollstunden geraten.
  if (targets.calendarMissing){
    return { original: raw, diff:"", calendarMissing:true };
  }

  // Hinterlegter Feiertag: wenn vorne nichts eingetragen wurde, wird automatisch F gesetzt.
  // Eine bewusste manuelle Eingabe vorne wird nicht überschrieben oder umgedeutet.
  const holiday = getHolidayName(d);
  if (!raw && holiday){
    return { original:"F", diff:"F", holiday };
  }

  // Kurzer Freitag ist im Original IMMER sichtbar.
  // Eingetragene Arbeitsstunden an diesem Tag sind vollständig Differenzstunden.
  const shortFriday = targets.week === "kurz" && targets.weekday === 5 && targets.p1 === 0;
  if (!raw){
    return { original: shortFriday ? "Kurz" : "", diff:"" };
  }

  // Reine Abwesenheits-/Sonderkürzel werden 1:1 übertragen.
  if (upper === "F")  return { original:"F",  diff:"F" };
  if (upper === "U")  return { original:"U",  diff:"U" };
  if (upper === "K")  return { original:"K",  diff:"K" };
  if (upper === "SU") return { original:"SU", diff:"SU" };
  if (upper === "SW") return { original:"SW", diff:"SW" };

  // U/SU + Zahl oder Zahl + U/SU -> Reihenfolge und Leerzeichen egal.
  // Beispiel: U + 9, 9 + U, SU+9, 9+SU.
  let m = upper.match(/^(U|SU)\s*\+\s*(\d+(?:[.,]\d+)?)$/);
  if (m){
    const code = m[1];
    const extra = parseLooseNumber(m[2]);
    return { original:code, diff: normalizeNumberString(extra) };
  }
  m = upper.match(/^(\d+(?:[.,]\d+)?)\s*\+\s*(U|SU)$/);
  if (m){
    const extra = parseLooseNumber(m[1]);
    const code = m[2];
    return { original:code, diff: normalizeNumberString(extra) };
  }

  // SW + 6 bzw. 6 + SW -> Original SW, Differenz nur die Zahl.
  m = upper.match(/^SW\s*\+\s*(\d+(?:[.,]\d+)?)$/);
  if (m){
    const extra = parseLooseNumber(m[1]);
    return { original:"SW", diff: normalizeNumberString(extra) };
  }
  m = upper.match(/^(\d+(?:[.,]\d+)?)\s*\+\s*SW$/);
  if (m){
    const extra = parseLooseNumber(m[1]);
    return { original:"SW", diff: normalizeNumberString(extra) };
  }

  // Allgemeine Slash-Kombinationen mit U/SU/SW/K/F, z.B. 5/2/SW, SW/5/2, 5/K, F/5.
  // Reihenfolge und Leerzeichen sind egal. Reine Zahlenanteile gelten als gearbeitet.
  // A-Kombinationen bleiben in der eigenen Arzt-Logik weiter unten.
  const generalSlash = parseGeneralSlashCombination(raw);
  if (generalSlash && !generalSlash.codes.includes("A")){
    const worked = generalSlash.worked;

    if (shortFriday){
      if (generalSlash.codes.includes("F")) return { original:"F", diff: worked > 0 ? normalizeNumberString(worked) : "F" };
      return { original:"Kurz", diff: worked > 0 ? normalizeNumberString(worked) : "" };
    }

    if (Number.isInteger(rowIndex)){
      const dayIndex = ((rowIndex % 7) + 7) % 7;
      if (dayIndex >= 5){
        return { original:"", diff: worked > 0 ? normalizeNumberString(worked) : "" };
      }
    }

    return { original:raw, diff:"" };
  }

  // 6/SW oder SW/6 -> unverändert ins Original, keine Differenz.
  m = upper.match(/^(\d+(?:[.,]\d+)?)\s*\/\s*SW$/);
  if (m) return { original: raw, diff:"" };
  m = upper.match(/^SW\s*\/\s*(\d+(?:[.,]\d+)?)$/);
  if (m) return { original: raw, diff:"" };

  // Arzt-Kombinationen mit beliebig vielen Slash-Teilen, z.B. 6/1/2A.
  // Alle Arbeitsanteile werden addiert, der A-Anteil bleibt im Original erhalten.
  // Original wird auf die jeweilige Sollzeit komprimiert: 6/1/2A -> 7/2A,
  // bei Hannes -> 8/2A. Die Differenz bleibt gegen Person-1-Soll.
  const multiDoctor = parseMultiDoctorHours(raw);
  if (multiDoctor){
    const total = multiDoctor.total;

    if (shortFriday){
      return { original:"Kurz", diff: total > 0 ? normalizeNumberString(total) : "" };
    }

    if (Number.isInteger(rowIndex)){
      const dayIndex = ((rowIndex % 7) + 7) % 7;
      if (dayIndex >= 5){
        return { original:"", diff: total > 0 ? normalizeNumberString(total) : "" };
      }
    }

    const target = person2 ? targets.p2 : targets.p1;
    let original = raw;
    if (Number.isFinite(target) && target > 0){
      const workTarget = Math.max(0, target - multiDoctor.doctor);
      if (multiDoctor.doctorIndex === 0){
        original = `${normalizeNumberString(multiDoctor.doctor)}A/${normalizeNumberString(workTarget)}`;
      } else {
        original = `${normalizeNumberString(workTarget)}/${normalizeNumberString(multiDoctor.doctor)}A`;
      }
    }

    const diff = Number.isFinite(targets.p1) ? Math.max(0, total - targets.p1) : 0;
    return { original, diff: diff > 0 ? normalizeNumberString(diff) : "" };
  }

  // Arzt-Kombinationen, z.B. 4A/5 oder 8/2A.
  // Für die Differenz zählt die Summe aus Arzt- und Arbeitszeit gegen Person-1-Soll.
  m = upper.match(/^(\d+(?:[.,]\d+)?)\s*A\s*\/\s*(\d+(?:[.,]\d+)?)$/);
  let doctorForm = "left";
  if (!m){
    m = upper.match(/^(\d+(?:[.,]\d+)?)\s*\/\s*(\d+(?:[.,]\d+)?)\s*A$/);
    doctorForm = "right";
  }
  if (m){
    const first = parseLooseNumber(m[1]) ?? 0;
    const second = parseLooseNumber(m[2]) ?? 0;
    const total = first + second;

    if (shortFriday){
      return { original:"Kurz", diff: total > 0 ? normalizeNumberString(total) : "" };
    }

    // Wochenende: komplette erfasste Zeit ist Differenz, Original bleibt leer.
    if (Number.isInteger(rowIndex)){
      const dayIndex = ((rowIndex % 7) + 7) % 7;
      if (dayIndex >= 5){
        return { original:"", diff: total > 0 ? normalizeNumberString(total) : "" };
      }
    }

    let original = raw;

    // Hannes: Original orientiert sich an seinem höheren Soll. Der A-Anteil bleibt unverändert,
    // nur der Arbeitsanteil wird bei Bedarf auf das Hannes-Soll ergänzt.
    if (person2 && Number.isFinite(targets.p2) && targets.p2 > 0 && total < targets.p2){
      if (doctorForm === "left"){
        const doctor = first;
        const work = Math.max(0, targets.p2 - doctor);
        original = `${normalizeNumberString(doctor)}A/${normalizeNumberString(work)}`;
      } else {
        const doctor = second;
        const work = Math.max(0, targets.p2 - doctor);
        original = `${normalizeNumberString(work)}/${normalizeNumberString(doctor)}A`;
      }
    }

    const diff = Number.isFinite(targets.p1) ? Math.max(0, total - targets.p1) : 0;
    return { original, diff: diff > 0 ? normalizeNumberString(diff) : "" };
  }

  // Mehrere Baustellenstunden, auch mit optionalem A-Anteil in einem Teilwert,
  // z.B. 3/3/3 oder 3/1,5/2/2,5A. Zuerst wird ALLES addiert.
  // Danach gilt dieselbe Soll-/Differenzlogik wie bei einer normalen Gesamtstundenzahl.
  const multiSiteHours = parseMultiSiteHours(raw);
  if (multiSiteHours !== null){
    if (Number.isInteger(rowIndex)){
      const dayIndex = ((rowIndex % 7) + 7) % 7;
      if (dayIndex >= 5) return { original:"", diff: multiSiteHours > 0 ? normalizeNumberString(multiSiteHours) : "" };
    }
    if (shortFriday) return { original:"Kurz", diff: multiSiteHours > 0 ? normalizeNumberString(multiSiteHours) : "" };
    if (!Number.isFinite(targets.p1)) return { original:raw, diff:"" };
    const diff = multiSiteHours - targets.p1;
    const originalTarget = person2 ? targets.p2 : targets.p1;
    const original = Number.isFinite(originalTarget) && originalTarget > 0 ? normalizeNumberString(originalTarget) : "";
    return { original, diff: Math.abs(diff) > 1e-9 ? normalizeNumberString(diff) : "" };
  }

  // Mehrere reine Baustellenstunden, z.B. 3/3/3 oder 3 / 4 / 3.
  const multiHours = parsePlainMultiHours(raw);
  if (multiHours !== null){
    if (Number.isInteger(rowIndex)){
      const dayIndex = ((rowIndex % 7) + 7) % 7;
      if (dayIndex >= 5) return { original:"", diff: multiHours > 0 ? normalizeNumberString(multiHours) : "" };
    }
    if (shortFriday) return { original:"Kurz", diff: multiHours > 0 ? normalizeNumberString(multiHours) : "" };
    if (!Number.isFinite(targets.p1)) return { original:raw, diff:"" };
    const diff = multiHours - targets.p1;
    const originalTarget = person2 ? targets.p2 : targets.p1;
    const original = Number.isFinite(originalTarget) && originalTarget > 0 ? normalizeNumberString(originalTarget) : "";
    return { original, diff: Math.abs(diff) > 1e-9 ? normalizeNumberString(diff) : "" };
  }

  // Normale Stunden.
  const hours = parseLooseNumber(upper);
  if (hours !== null && /^[-+]?\d+(?:[.,]\d+)?$/.test(upper)){
    if (Number.isInteger(rowIndex)){
      const dayIndex = ((rowIndex % 7) + 7) % 7;
      if (dayIndex >= 5){
        return { original:"", diff: hours > 0 ? normalizeNumberString(hours) : "" };
      }
    }

    if (shortFriday){
      return { original:"Kurz", diff: hours > 0 ? normalizeNumberString(hours) : "" };
    }

    if (!Number.isFinite(targets.p1)){
      return { original: raw, diff:"" };
    }

    // Differenz IMMER gegen Person 1, auch bei Hannes.
    // Bei normalen numerischen Arbeitstagen werden jetzt auch Minusstunden ausgewiesen.
    // Sonderfälle wie U/SU/K/F/SW/A bleiben davon ausdrücklich ausgenommen.
    const diff = hours - targets.p1;

    // Original zeigt immer die Sollzeit der jeweiligen Person, auch wenn vorne weniger steht.
    const originalTarget = person2 ? targets.p2 : targets.p1;
    const original = Number.isFinite(originalTarget) && originalTarget > 0
      ? normalizeNumberString(originalTarget)
      : "";

    return { original, diff: Math.abs(diff) > 1e-9 ? normalizeNumberString(diff) : "" };
  }

  // Unbekannte Eingaben werden nicht erfunden oder umgedeutet.
  return { original: raw, diff:"" };
}

  add("7/2SU Arbeitssumme", parseWorkedHoursForSum("7 / 2SU"), "7");
  add("7/2SW Arbeitssumme", parseWorkedHoursForSum("7/2SW"), "7");
  add("7+2SW Arbeitssumme", parseWorkedHoursForSum("7 + 2Sw"), "7");
  add("5/2/SW Arbeitssumme", parseWorkedHoursForSum("5 / 2 / SW"), "7");

  let plusCode = computeHoursEntry("U + 9", d(2026,7,1), false, 2);

  plusCode = computeHoursEntry("9 + SU", d(2026,7,1), false, 2);
  add("9+SU Original", plusCode.original, "SU");
  add("9+SU Differenz", plusCode.diff, "9");

  // 2026: erste Aprilwoche ist KURZ, 06.-10.04. und 13.-17.04. sind LANG.
  let r = computeHoursEntry("9", d(2026,4,1), true, 2);   // Mi, Hannes, kurz

  r = computeHoursEntry("4A/5", d(2026,7,9), false, 3);

  r = computeHoursEntry("9", d(2026,4,1), true, 2);

  r = computeHoursEntry("10", d(2026,4,10), true, 11);
  add("Hannes Freitag 8h Arbeitszeit", buildAutomaticWorktimeFromFront("10", d(2026,4,10), 11, r), "7:00 - 16:00; 1 Stunde Pause");
